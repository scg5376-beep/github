<h1>실제 사례 모음</h1>
<p class="lead">사장님, 남의 가게가 실제로 어떻게 됐는지가 제일 궁금하시죠. 설명 글에 흩어져 있던 사례를 한 장에 모았어요. 상호는 업종과 동네까지만 적었고 출처는 사례마다 붙어 있어요.</p>

<p>여기 없는 업종은 아직 근거 있는 사례를 못 찾은 거예요. 찾으면 더해요.</p>
