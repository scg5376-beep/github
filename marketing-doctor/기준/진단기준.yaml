    분류: 메시지 정합성
    심각도: 치명
    감점: 15
    탐지: 제목의 소구점과 다른 소구점이 본문에 2회 이상
    근거: 확정   # 네이버 C-Rank 는 주제 집중도를 본다
    참고: |
      소구점의 단위는 업종팩의 `소구점_단위` 를 따른다(안경원=브랜드, 미용실=시술 …).
      한 글은 하나의 소구점만 다룬다. 함께 파는 물건이라도 섞지 않는다.
        예) 안경테 글에 렌즈 브랜드를 한 줄 넣는 것도 포인트가 갈린다.
      단위가 달라도 원칙은 같다 — 메시지가 하나로 명확해야 한다.
    한마디: "A를 보러 온 사람에게 B가 나오면 그 사람은 그냥 나갑니다"

