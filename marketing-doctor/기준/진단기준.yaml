      - "(제가|저희가|저는)[^.!?\n]{0,40}(했|였|봤|셨|드렸|배웠|알았|깨달)"
      - "(해\\s?보니|써\\s?보니|겪어\\s?보니|들어\\s?보니|맞춰\\s?보니)"
      - "직접[^.!?\n]{0,20}(해\\s?봤|써\\s?봤|만들었|확인했|테스트|겪)"
      - "손님(이|들이|께서)[^.!?\n]{0,20}(물어|여쭤|자주|많이 찾)"
      - "(처음에는|알고 보니|나중에 알|그때는)"
      - "겪"
    근거: 확정   # 네이버 D.I.A. 의 '경험 정보' · 구글 E-E-A-T 의 Experience
    한마디: "겪은 이야기가 없으면 어디서든 볼 수 있는 글입니다"

  - id: G4
    이름: 실패담이 남 탓으로 감
    분류: 경험
    심각도: 권장
    감점: 8
    탐지어: [진상, 이상한 손님, 무개념, 타 업체는, 다른 곳은 엉터리, 싼 데 가면, 다른 데서 하면 후회]
