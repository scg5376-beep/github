# ------------------------------------------------------------
#  채점 방식: 100점에서 시작 → 발견된 문제만큼 감점 → 최저 0점
#  원칙 1. 네이버 알고리즘은 비공개다. "저품질입니다" 라고 단정하지 않는다.
#          모든 문구는 "위험 신호" 로 표현한다.
#  원칙 2. 사장님이 입력하지 않은 정보로는 감점하지 않는다.
#          (주소를 안 넣었으면 주소 항목은 건너뛴다)
#  원칙 3. 한 항목은 최대 1회만 감점한다. 같은 문제가 10번 나와도 감점은 1회.
