  - id: E2
    이름: 절대적 보장 표현
    분류: 과장·금지 표현
    심각도: 권장
    감점: 8
    탐지어: [100%, 반드시 효과, 확실히 낫, 부작용 없]
    탐지식:                     # 부사로 쓰인 것은 넘기고 주장만 잡는다 → 보정기록.md
      - "(무조건|절대)\\s*[^.!?\n]{0,10}(효과|안전|보장|성공|만족|낫|좋아지|해결|가능합니다|됩니다)"
      - "(무조건|절대)\\s*(입니다|예요|이에요)"
    근거: 확정
    한마디: "'무조건·100%' 는 지킬 수 없는 약속으로 봅니다"

