    참고: |
      실패담은 신뢰를 만든다. 단, 주어가 '나' 일 때만 그렇다.
        ⭕ 제가 처음에 이렇게 안내드렸다가 손님이 헛걸음하셨습니다
        ❌ 손님들이 말을 안 들어서 / 다른 데서 싸게 하면 후회합니다
      남 탓 실패담은 신뢰가 아니라 반감을 만든다. 읽는 사람이 자기 얘기로 듣는다.
    한마디: "실패담은 주어가 '저' 일 때만 신뢰가 됩니다"

