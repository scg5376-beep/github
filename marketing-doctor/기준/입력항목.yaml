# ⚠️ 지금 안 쓰는 파일입니다 (보관 중)
# 점수·감점 방식의 글 진단기는 중단됐습니다. 방향이 '알려주는 블로그' 로 바뀌었습니다.
# 글쓰기 규칙을 여기서 가져오지 마세요 → 콘텐츠/전달규칙.md
# 자세한 건 CLAUDE.md 의 '지금 안 쓰는 것'
# ────────────────────────────────────────────────────────────

# ============================================================
#  진단기가 받는 입력
# ------------------------------------------------------------
#  핵심: 가게 정보는 최초 1회만. 매번 넣는 건 제목·본문 두 개뿐.
# ============================================================
버전: 0.1

매번:                          # 글 쓸 때마다 — 이것만 받는다
  - 키: 제목
    입력칸: 별도
    필수: true
    쓰는곳: [B1, B5, F1]
    안내: "네이버 블로그 제목칸에 넣을 문장을 그대로"

  - 키: 본문
    입력칸: 별도
    필수: true
    쓰는곳: [나머지 전부]
    안내: "본문을 통째로 붙여넣으세요"

  - 키: 공략_키워드
    입력칸: 별도
    필수: false            # 안 넣으면 B1·F1 만 건너뛴다
    형식: 등록 목록에서 선택 또는 직접 입력
    쓰는곳: [B1, F1]
    안내: "이 글로 잡고 싶은 검색어 하나. 글마다 다릅니다"

최초1회:                       # 가게 등록 — 한 번 넣으면 계속 쓴다
  - 키: 상호
    필수: true
    쓰는곳: [A3, C3]
  - 키: 우리_도시
    필수: true
    예: 중앙시
    쓰는곳: [B1, A2]
  - 키: 우리_동
    필수: false
    예: 중앙동
    쓰는곳: [B1, A2]
  - 키: 인근_동
    필수: false
    형식: 목록
    예: [역전동, 신도시, 행복동]
    쓰는곳: [A2, F2]
    안내: "가까운 동네들. 이 동네를 잡으려면 그 동네 글을 따로 써야 합니다"
  - 키: 업종
    필수: true
    형식: 업종팩 id
    쓰는곳: [D1, D2, A6, E3, F1]
  - 키: 공략_키워드_목록
    필수: true
    형식: 목록
    예: ["중앙시 브랜드A", "중앙시 브랜드B", "중앙동 미용실", "장마철 안경 김서림"]
    쓰는곳: [F1]
    안내: |
      잡고 싶은 검색어를 모아둔 목록. 글마다 여기서 하나를 골라 공략한다.
      목록을 채우는 방법은 여러 가지다 — 어느 하나로 한정하지 않는다.
        · 우리가 파는 것 × 우리 동네   (가장 흔함)
        · 시기·상황                  (장마철 김서림, 개학 전 아이 안경)
        · 인근 동네 × 파는 것         (그 동네를 잡기로 정한 시점에)
      F1 은 "이 글의 공략 키워드 말고 다른 등록 키워드가 본문에 여러 번 나오는지" 를 본다.
  - 키: 전화번호
    필수: false
    형식: 목록
    안내: "쓰는 번호를 전부. 여기 없는 번호가 글에 나오면 옛 번호로 봅니다"
    쓰는곳: [C1, C2]
  - 키: 주소
    필수: false
    쓰는곳: [C4]

안받는것:                      # 일부러 받지 않는다
  - 항목: 직전 글
    이유: "진단은 이 글 한 편만 본다. 발행 관리는 진단의 일이 아니다."
  - 항목: 블로그 주소
    이유: "남의 블로그를 읽어올 이유가 없다. 진단에 필요한 건 붙여넣은 글뿐."
  - 항목: 이미지
    이유: "미정 — 텍스트 진단 범위를 먼저 확정한다."
