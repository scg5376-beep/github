- id: MT-02
  이름: 메타 광고 기준(Advertising Standards)과 광고 검토 정책
  저자: Meta
  기관: Meta 투명성 센터 · Meta for Business
  등급: A
  근거: 공식
  원문확인: true
  확인자: 사장님 (링크를 직접 열어 전문 확보)
  확인일: 2026-09-01
  원문보관: 지식/원전/원문/메타/
  전문확인:
  - Meta 광고 규정 — 개요·정책 원칙·검토 절차·거부 시 조치 (한국어판)
  - Meta 광고 검토 (광고주 가이드)
  미확인:
  - 카테고리별 세부 규정 (금지 콘텐츠·제한 콘텐츠 각 항목 페이지)
  - 비즈니스 자산에 대한 광고 제한 상세 문서
  공식문서위치: 확인됨
  공식문서:
  - 이름: Introduction to the Advertising Standards (광고 기준 소개)
    url: https://transparency.meta.com/policies/ad-standards/
  - 이름: 한국어판 광고 기준
    url: https://transparency.meta.com/ko-kr/policies/ad-standards/
  - 이름: Ads Review Policy for Businesses (광고 검토 정책)
    url: https://www.facebook.com/business/ads/review-policy-guidelines
  - 이름: 사회 문제·선거·정치 광고 (Special Ad Category)
    url: https://transparency.meta.com/policies/ad-standards/SIEP-advertising/SIEP/
  결과: |
    ★ 메타가 직접 꼽은 '가장 흔한 광고 위반' 다섯 (검토 가이드 전문)
      개인적 특성    "예를 들어 광고에서 개인적인 특성을 언급하기 위해
                    '여러분'이나 '여러분의' 같은 단어를 사용하지 마세요"
      건강·외모      "이상화된 결과를 보여주기 위해 비포 앤 애프터 이미지를
                    사용하지 마세요"
      품질 낮은 콘텐츠 과도하게 선정적인 헤드라인 · 인위적 반응 유도 ·
                    오리지널 콘텐츠가 최소한인 랜딩 페이지 ·
                    "과도하게 잘렸거나 전체 이미지를 보려면 광고를 클릭해야 하는
                     광고 이미지를 사용하지 마세요"
      특별 광고 카테고리 신용·고용·주택·사회 문제/선거/정치
                    "캠페인을 만들 때 해당 사실을 명시해야 합니다"
      비현실적인 결과  건강·체중 감량·경제적 기회

    ★ 재검토를 유발하는 변경 넷 (머신 러닝 재시작과는 다른 축이다)
      타게팅 · 크리에이티브(이미지·텍스트·링크·동영상) · 최적화 · 청구 이벤트
      → MT-01 의 '머신 러닝 단계 재시작' 과 헷갈리면 안 된다.
        하나는 광고 검토가 다시 도는 것, 하나는 학습이 처음부터 도는 것이다.

    ★ 광고 계정 제한을 부르는 행동 넷 (원문 그대로)
      · Meta 정책을 심각하게 또는 반복적으로 위반하는 경우
      · Meta의 검토 절차 및 규정 시행 조치를 회피하거나 회피하려고 시도하는 경우
      · 허위 사용자 계정을 사용하여 비즈니스 자산을 설정하고 광고를 게재하는 경우
      · 다른 악성 자산에 연결되어 있는 비즈니스 자산을 관리하거나
        이미 삭제된 비즈니스 자산과 유사한 행태를 보이는 경우

    검토 절차
      게재 전 자동 시작, 보통 24시간 이내(더 걸릴 수 있음), 상태는 '검토 중'
      검토 대상 — "이미지, 동영상, 텍스트, 타게팅 정보 등의 광고의 특정 구성 요소는
      물론 광고에 연결된 랜딩 페이지나 기타 랜딩 페이지 등"
      비즈니스 자산(광고 계정·페이지·사용자 계정)도 검토 대상이다.
      "주로 자동화 기술" 을 쓰되 "경우에 따라 광고를 수동으로 검토하기 위해
       인적 검토를 진행하기도 합니다"
      ★ "저희 정책을 위반하지는 않지만 품질이 낮은 광고의 경우 성과에 영향이
        있을 수 있습니다" — 거부가 아니어도 성과가 깎인다

    재검토 요청 시간이 둘로 갈린다
      광고 거부 재검토   보통 24시간 이내
      계정 제한 재검토   보통 48시간 이내
      창구 — 계정 품질(facebook.com/accountquality) · 비즈니스 지원 홈

    메타가 "특히 혼동하기 쉬운 부분" 으로 직접 꼽은 셋
      사생활 보호권 침해 및 개인적 특성 · 선정적인 콘텐츠 ·
      비즈니스 자산에 대한 광고 제한

    광고 라이브러리 — 사회 문제·선거·정치 광고는 "광고 라이브러리에 7년간 보관"
    모든 Facebook 페이지에 '정보 및 광고' 섹션이 있어 활성 광고를 볼 수 있다.
  못한것: |
    카테고리별 세부 규정 페이지(금지 콘텐츠·제한 콘텐츠 각 항목)는 못 봤다.
    '비즈니스 자산에 대한 광고 제한' 상세 문서도 못 봤다.
    한국에 특수하게 적용되는 조건이 있는지 확인하지 못했다.
  승급조건: 남은 것은 카테고리별 세부 규정 페이지다.
  확인한곳:
  - https://transparency.meta.com/policies/ad-standards/
  - https://www.facebook.com/business/ads/review-policy-guidelines
