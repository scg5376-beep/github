- id: MT-02
  이름: 메타 광고 기준(Advertising Standards)과 광고 검토 정책
  저자: Meta
  기관: Meta 투명성 센터 · Meta for Business
  등급: B
  근거: 공식
  원문확인: false
  공식문서위치: 확인됨
  공식문서:
  - 이름: Introduction to the Advertising Standards (광고 기준 소개)
    url: https://transparency.meta.com/policies/ad-standards/
  - 이름: 한국어판 광고 기준
    url: https://transparency.meta.com/ko-kr/policies/ad-standards/
  - 이름: Ads Review Policy for Businesses (광고 검토 정책)
    url: https://www.facebook.com/business/ads/review-policy-guidelines
  - 이름: 사회 문제·선거·정치 광고 (Special Ad Category)
    url: https://transparency.meta.com/policies/ad-standards/SIEP-advertising/SIEP/
  결과: |
    ⚠️ 아래는 전부 2차 경로로 확인한 것이다. 메타 도메인이 이 환경에서 전부 막혀
    원문을 열지 못했다. "메타 문서에 이렇게 적힌 것으로 전해진다" 로 쓴다.

    광고 검토 절차
      · 광고가 게재되기 전에 자동으로 검토가 시작되며, 보통 24시간 이내에 끝난다.
        더 걸릴 수도 있다. 검토 중에는 상태가 '검토 중(In review)' 으로 표시된다.
      · ★ 검토 대상에 이미지·동영상·텍스트·타겟팅 정보뿐 아니라
        랜딩 페이지·웹사이트 같은 '도착 페이지' 가 포함된다.
      · 광고가 시작된 뒤에도 다시 검토될 수 있고 언제든 거부될 수 있다.
      · 메타는 광고주 행동을 모니터링·조사하며, 광고 기준·커뮤니티 규정 등을
        지키지 않는 광고 계정을 제한할 수 있다.

    광고 기준의 구조 (세 층으로 정리돼 있다고 전해진다)
      금지 콘텐츠        어떤 광고주도 못 한다
      제한 콘텐츠        조건부 허용 (연령 제한 · 사전 승인 · 지역 제한 · 고지 문구 등)
      특별 광고 카테고리  신용 · 고용 · 주택 · 사회 이슈/선거/정치
                        타겟팅 제한이 따로 걸린다
  못한것: |
    카테고리별 세부 목록을 원문으로 확인하지 못했다.
    '금지' · '제한' 각 항목에 무엇이 들어가는지 2차 자료마다 표현이 다르다.
    한국에 특수하게 적용되는 조건이 있는지도 확인하지 못했다.
  승급조건: |
    위 URL 을 열어 붙여 주시면 A. transparency.meta.com · facebook.com 모두
    이 환경에서 차단됐다.
  확인한곳:
  - https://transparency.meta.com/policies/ad-standards/
  - https://www.facebook.com/business/ads/review-policy-guidelines

