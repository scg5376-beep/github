  부분확인: "A 는 전문을 확보한 세 건이다 —\n  「커머스 자격 요건」 · 「영향이 큰 변경 및 머신 러닝 단계」 · 「머신 러닝 단계」\n랭킹 신호(Mosseri 발언) ·\
    \ 제품 태그 20개 · 신청 절차는 여전히 B 다.\n"
  용어주의: '공식 한국어 용어는 ''머신 러닝 단계'' 와 ''제한된 머신 러닝'' 이다.

    ''학습기'' · ''러닝 페이즈'' · ''학습 제한'' 으로 쓰지 않는다.

    '
  APAC정책변화: "2023-08-10 부터 APAC 대부분의 사업자는 페이스북·인스타그램 페이지에\n숍을 호스팅할 수 없게 됐다. 예외 7개국 —\n호주 · 한국 · 대만 · 인도\
    \ · 일본 · 인도네시아 · 태국.\n한국은 예외에 포함돼 '체크아웃 없는 숍' 을 계속 쓸 수 있다.\n예외가 아닌 나라는 게시물·릴스·스토리의 제품 태그도 못 쓴다.\n\
    → 메타가 APAC 에서 숍을 줄이는 방향이었고 한국은 살아남은 쪽이다.\n  언제든 또 바뀔 수 있다는 뜻이므로 반년마다 확인한다.\n"
  공식문서:
  - 이름: 커머스 자격 요건 (Commerce Eligibility Requirements)
    url: https://help.instagram.com/1627591223954487
  - 이름: 샵의 카탈로그 자격 요건
    url: https://www.facebook.com/business/help/1205792533104321
  - 이름: Instagram 게시물에서 제품 태그 추가하기 (한국어)
    url: https://ko-kr.facebook.com/business/help/373467539912975
  발언출처: '랭킹 신호와 ''링크 불이익 없음'' 은 Adam Mosseri 의 공개 발언이다.

    원 발언(인스타 영상·Q&A)을 직접 못 봤고, 다수 2차 자료가 일치하는 인용으로 확인했다.

    '
