  - 「네이버가 알려주는 네이버 검색」 시리즈의 나머지 편
  결과: |
    C-Rank 공식 정의 (22927 전문)

      "개별 문서보다는 해당 문서 출처의 신뢰도를 평가하는 알고리즘"

      관심사 집중도 (Context)
      정보의 품질   (Content)
      소비 및 생산의 연쇄반응 (Chain)
        → 종합적으로 판단해
      해당 블로그가 얼마나 믿을 수 있고 인기 있는지 (Creator) 를 계산

    ★ 이 문서에는 '주제별' 이라는 말이 없다.
      "주제별 출처의 신뢰도" 는 NV-03(웹 콘텐츠 스팸사례) 쪽 문구다.
      두 문서를 섞어 인용하지 않는다.
    ★ "지속적으로 테스트 및 개선하고 있습니다" — 고정된 규칙이 아니라고 밝힌다.

    D.I.A. 공식 정의 (22926 전문)

      "Deep Intent Analysis. 네이버의 데이터를 기반으로 키워드별로 사용자들이
       선호하는 문서에 대한 점수를 랭킹에 반영한 모델"
      "문서 자체의 경험과 정보성을 분석" · C-Rank 와 "상호 보완적인 역할"

      반영되는 요인 (원문 그대로, 일곱 가지 + '등')
        문서의 주제 적합도 · 경험 정보 · 정보의 충실성 · 문서의 의도 ·
        상대적인 어뷰징 척도 · 독창성 · 적시성

    ★ 업계에 도는 'D.I.A. 7요소' 목록이 공식 문서에 실제로 있었다.
      전에는 2차 자료라고 표시해 뒀는데, 확인 결과 원문과 같다.
      다만 원문도 '등' 으로 끝난다. 일곱 개가 전부는 아니다.
    ★ "매일 변화하는 데이터에 대한 딥러닝을 통해 품질요소와 기준값이 업데이트된 후,
       정규화된 점수로 환산되여 랭킹 로직에 주기적으로 자동 반영됩니다."
       → 기준값 자체가 매일 바뀐다. 고정된 점수표가 없다는 뜻이다.

    블로그 검색 소개 (22921 전문)

      ★ C-Rank·D.I.A. 가 전부가 아니다.
      "C-Rank 기술이나 D.I.A. 모델 등 다수의 모델이 적용되었으며,
       변질·스팸·유사 문서 관련 분석 로직도 지속적으로 고도화되어 적용되고 있습니다"
      → 순위를 올려주는 로직(C-Rank·D.I.A.) 과 별개로
        걸러내는 로직(변질·스팸·유사 문서)이 따로 돈다.
        '유사 문서' 는 남의 글과 닮은 것 자체가 걸린다는 뜻이다.
      → "등 다수의 모델" 이므로 우리가 아는 게 전부가 아니다.
        '네이버 알고리즘은 두 개' 라고 단정하지 않는다.

      외부 블로그
      "블로그 검색은 네이버 블로그 및 수집된 외부 블로그의 글이 노출될 수 있습니다."
      "외부 블로그의 경우에도 검색 로봇에 의해 수집/분석이 되어야 제공 가능하므로
       기대와 다르게 노출되지 않는 문서들이 있을 수 있습니다."
      "모든 블로그가 제공되는 것은 아닐 수 있는 점 양해 부탁드리며"
      → 외부 블로그는 수집이라는 관문을 하나 더 거친다.
        ⚠️ 네이버가 "네이버 블로그가 유리하다" 고 말한 건 아니다. 거기까지만 쓴다.

    공식블로그 C-Rank 상세 (2016-07-29 전문)
      ★ 2016년 글이다. 인용할 때 반드시 연도를 붙인다.
        문서 안에 "참고하는 항목들은 알고리즘 개선을 위해 계속 변경 적용됩니다" 라고
        네이버가 직접 못 박아 뒀다.

      C-Rank 참고 데이터 6가지 (표로 공개)
        BLOG Collection      제목·본문·이미지·링크로 문서의 기본 품질
        네이버 DB            인물·영화 등 네이버 보유 DB 연동 → 신뢰도
        Search LOG           검색 로그로 문서·출처의 인기도
        Chain Score          웹문서·사이트·뉴스 등 다른 출처에서의 관심 정도
        BLOG Activity        블로그 서비스 활동 지표
        BLOG Editor 주제 점수 딥러닝으로 주제 분류 + 집중도

      ★ 네이버가 인정한 한계 — 다른 데서 못 보는 문장이다
        "문서 자체의 품질보다는 출처의 품질에 따른 결과가 강조될 가능성"
        "좋은 블로그라고 항상 좋은 글만, 나쁜 블로그라고 항상 나쁜 글만
         생산하는 것은 아니기 때문"
        "속칭 '최적화 블로그'나 '저품질 블로그'라고 이야기되는 것과
         유사한 현상이 나타날 수 밖에 없고"
        → 용어는 네이버 것이 아니지만, 현상이 없다고 한 적도 없다.
          "저품질은 없습니다" 로 쓰면 이 문장과 어긋난다.

      ★ 비중이 고정이 아니다
        2016년 시점 "매우 제한적인 영향만 미치도록 활용되어 왔"고
        "그 비중을 점차 늘려 가고 있"다고 했다. 지금 비중은 모른다.

      ★ '네이버 라이브 검색' 은 지금 없는 서비스다
        원문에 라이브 검색 이야기가 많은데 그대로 옮기면 안 된다.
        네이버도 "라이브 검색 C-Rank와 블로그 검색 C-Rank가 같다고 할 수는
        없습니다" 라고 밝혔다.
