#           해외-리뷰응대 · 해외-보여주기 · 해외-브랜드성장

버전: 1.0
갱신일: 2026-09-01

원전:
- id: AD-01
  이름: "Frontiers: Which Firms Gain from Digital Advertising? Evidence from a Field Experiment"
  저자: Weijia (Daisy) Dai · Hyunjin Kim · Michael Luca
  기관: Marketing Science 42(3), 429~439 (동료심사 학술지)
  연도: 2023
  등급: B
  근거: 실증
  원문확인: false
  방법: |
    ★ 무작위 배정 현장실험이다. 이 창고에서 가장 강한 설계다.
    Yelp 과 함께 설계해 식당 18,294곳을 대상으로 진행했다.
    그중 7,209곳을 무작위로 뽑아 Yelp 의 표준 광고 패키지를 3개월간 무료로 줬다.
    나머지는 대조군이다. 어느 가게가 광고를 받을지 가게가 고른 게 아니다.
  결과: |
    광고를 받은 식당에서
      구매 의도 지표 여러 가지가 평균 7~19% 증가
      리뷰 수 5% 증가

    ★ 그리고 효과가 가게마다 달랐다. 더 크게 이득을 본 쪽은
      · 독립 매장 (체인 아님)
      · 평점이 높은 곳
      · 리뷰가 많은 곳
      · 실험 전부터 자연 유입이 많던 곳
  한계: |
    ★ 이 셋을 빼고 인용하면 틀린 글이 된다.
    ① 잰 것은 '구매 의도 지표' 다. 매출이 아니다.
       길찾기·전화·웹사이트 방문·리뷰 같은 행동이다. 실제 매출은 보지 않았다.
    ② 광고를 무료로 줬다. 그러니 이건 '광고의 효과' 이지 '광고비의 값어치' 가 아니다.
       ROI 를 잰 연구가 아니다.
    ③ 미국 Yelp 의 식당이다. 한국 네이버가 아니다.
  승급조건: |
    NBER 워킹페이퍼(w30925) 또는 학술지 본문을 열어 붙여 주시면 A.
    nber.org · dash.harvard.edu · ssrn · pubsonline · dl.acm · insead 전부 차단.
  확인한곳:
  - https://pubsonline.informs.org/doi/10.1287/mksc.2023.1436
  - https://www.nber.org/papers/w30925
  - https://doi.org/10.2139/ssrn.4349557
  - https://www.insead.edu/faculty-research/publications/journal-articles/frontiers-which-firms-gain-digital-advertising

- id: AD-02
  이름: "Consumer Heterogeneity and Paid Search Effectiveness: A Large-Scale Field Experiment"
  저자: Thomas Blake · Chris Nosko · Steven Tadelis
  기관: Econometrica 83(1), 155~174 (경제학 최상위 학술지)
  연도: 2015
  등급: B
  근거: 실증
  근거유형: AD-01 의 반대편. 같은 무작위 실험 설계인데 결론이 반대로 나왔다.
  원문확인: false
  방법: eBay 에서 진행한 대규모 현장실험 시리즈. 검색광고를 껐다 켜며 인과 효과를 쟀다.
  결과: |
    브랜드 키워드 광고
      단기 효과가 측정되지 않았다. ('eBay' 를 검색한 사람은 광고가 없어도 온다)

    비브랜드 키워드 광고
      신규·저빈도 이용자는 광고에 반응했다.
      그런데 광고비의 대부분을 쓰게 만드는 것은 고빈도 이용자이고,
      이들의 구매 행동은 광고에 영향받지 않았다.
      → 평균 수익률이 음수로 나왔다.

    ★ 실험으로 구한 수익률이 통상적인 비실험 추정치의 일부에 불과했다.
      즉 광고 플랫폼이 보여주는 성과 숫자는 대개 부풀려져 있다.
  한계: |
    eBay 다. 모르는 사람이 거의 없는 큰 브랜드다.
    동네 가게와 처지가 정반대다. 그대로 옮기면 안 된다.
    2015년 연구다. 검색광고 지면과 알고리즘이 그 뒤로 많이 바뀌었다.
  승급조건: NBER 워킹페이퍼(w20171) 또는 Econometrica 본문. 관련 도메인 전부 차단.
  확인한곳:
  - https://onlinelibrary.wiley.com/doi/abs/10.3982/ECTA12423
  - https://www.nber.org/papers/w20171
  - https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2444538

안쓰기로한것:
- 수치: "손님의 70%는 가게 겉모습을 보고 들어갈지 정한다"
  출처: 마케팅 블로그 다수
  이유: 원 조사를 찾지 못했다. 표본·연도·조사기관이 어디에도 없다.
- 수치: "구매의 95%는 감정이 결정한다"
  출처: 마케팅 블로그 다수
  이유: |
    널리 도는 말이지만 원 출처가 특정되지 않는다.
    하버드 교수 제럴드 잘트만의 말로 인용되는 일이 많은데,
    그 원문을 확인하지 못했다. 숫자가 둥글수록 조심한다.
