갱신일: 2026-08-31

원전:
- id: SK-01
  이름: "Skimpflation Outrage: Decreases in Product Quality are Seen as Much More Unfair Than Decreases in Size and Increases in Price"
  저자: Ioannis Evangelidis
  기관: ESADE, Universitat Ramon Llull · Marketing Science Institute Working Paper 24-107
  연도: 2024-02-27 제출 (학술지 게재본은 Journal of Consumer Research, doi 10.1093/jcr/ucag019)
  등급: A
  근거: 실증
  원문확인: true
  원문보관: 지식/원전/원문/
  자료: 사전등록 실험 6건 · Prolific 응답자 · 표본 200 / 201 / 200 / 502 / 1,001 등
  결과: |
    원가가 올랐을 때 회사가 할 수 있는 세 가지를 같은 사람에게 물었다.
    답이 극단적으로 갈렸다.

      가격을 올린다     공정하다 85%    불공정 15%
      양을 줄인다       공정하다 57.5%  불공정 42.5%
      질을 낮춘다       공정하다 16.5%  불공정 83.5%   ← 압도적

    제품 카테고리를 바꿔도(초콜릿·스트리밍·올리브 스프레드·보습크림 외 4종)
    순서가 한 번도 뒤집히지 않았다.
    저자의 결론: "decreasing the quality of products is not a viable option.
    Consumers strongly prefer price increases over reductions in quality or size."

    왜 그런가(실험 5, N=1,001)
      · 가격 인상은 '눈에 보여서' 덜 속인다고 느낀다
      · 양 줄이기와 질 낮추기는 '알아채기 어렵다' 는 점에서 똑같이 나빴다
      · 그런데 질 낮추기가 더 나쁜 이유는 따로 있다 —
        "제품 자체가 달라졌다" 고 느끼기 때문이다. 먹는 경험이 바뀐다.

    같은 저자의 앞선 연구(Evangelidis 2023, Marketing Science)도 이 논문 안에서 인용된다:
    양 줄이기가 같은 값어치의 가격 인상보다 더 불공정하게 여겨진다.
  한계: |
    ★ 이 논문에는 한계(limitations) 절이 없다. 그건 그것대로 적어 둔다.
    · 잰 것은 '공정하다고 말하는가' 이지 '그래서 안 사는가' 가 아니다.
      실험 4·5에서 구매 의향도 같은 방향으로 나왔지만, 실제 매출을 잰 것은 아니다.
    · Prolific 응답자다. 대체로 영미권이다. 한국 표본이 아니다.
    · 가상 시나리오다. 진짜 단골 가게가 아니라 이름 없는 '제조사' 다.
  확인한곳:
  - https://thearf-org-unified-admin.s3.amazonaws.com/MSI_Report_24-107.pdf
  - https://academic.oup.com/jcr/advance-article/doi/10.1093/jcr/ucag019/8725346

- id: FP-01
  이름: "Fairness as a Constraint on Profit Seeking: Entitlements in the Market"
  저자: Daniel Kahneman · Jack L. Knetsch · Richard Thaler
  기관: American Economic Review 76(4), 728~741
  연도: 1986
  등급: B
  근거: 실증
  원문확인: false
  자료: 캐나다(토론토·밴쿠버) 거주자 전화 설문. 가상 상황을 주고 공정/불공정을 물었다.
  결과: |
    이 분야의 뿌리가 되는 연구다. 핵심은 '이중 자격(dual entitlement)' 이다.

      손님에게는 '기준 가격' 이, 가게에는 '기준 이익' 이 있다.
      가게가 기준 이익을 지키려고 값을 올리는 것은 공정하다고 느낀다.
      반면 수요가 늘었다고 값을 올리는 것은 불공정하다고 느낀다.

    가장 유명한 문항 — 눈삽
      "철물점이 눈삽을 $15 에 팔고 있었다. 큰 눈이 온 다음 날 아침 $20 으로 올렸다."
      응답자 107명 중 82% 가 불공정하다고 답했다.

    뒤집으면 이렇게 된다.
      원가가 올라서 값을 올린다   → 받아들여진다
      잘 팔려서 값을 올린다        → 받아들여지지 않는다
      원가가 내렸는데 값을 그대로  → 불공정하다고 느끼지만 덜 심하다
  한계: |
    전화 설문이다. 가상 상황에 대한 '말' 이지 실제 구매 행동이 아니다.
    1986년 캐나다다. 40년 전 다른 나라 표본이다.
  승급조건: |
    원문 PDF 를 열어 붙여 주시면 A. 여러 대학이 올려 둔 사본이 있으나
    (chicagobooth · MIT) 이 환경에서 전부 차단됐다.
  확인한곳:
  - https://econpapers.repec.org/RePEc:aea:aecrev:v:76:y:1986:i:4:p:728-41
  - https://faculty.chicagobooth.edu/-/media/research/cdr/docs/thaler/fairness-as-a-constraint-on-profit-seeking.pdf

- id: FP-02
  이름: Consumer Perceptions of Price (Un)Fairness
  저자: Lisa E. Bolton · Luk Warlop · Joseph W. Alba
  기관: Journal of Consumer Research 29(4), 474~491
  연도: 2003
  등급: B
  근거: 실증
  원문확인: false
  결과: |
    ★ 사장님에게 가장 중요한 단서다.

    손님은 파는 값이 '공정한 값' 보다 훨씬 높다고 믿는 쪽으로 기운다.
    이유는 손님이 가게 원가를 제대로 모르기 때문이다.
      · 가게가 실제로 무는 비용의 전 범위를 계산에 넣지 않는다
      · 그래서 가격 차이를 대부분 '이익' 으로 돌린다(overattribute to profit)
      · 물가 상승분의 영향도 과소평가한다

    즉 "원가가 올랐습니다" 라고 말해도 손님은 그 말을 곧이 안 듣는다.
    다만 이 논문은 그 반대편도 보여준다 — 그 요소들을 눈에 보이게 해주면
    공정하다는 판단이 올라간다(SK-01 이 인용하는 부분:
    "Interventions making those factors salient can boost judgments of fairness").
  승급조건: 원문을 열어 붙여 주시면 A. academic.oup.com 차단.
  확인한곳:
  - https://academic.oup.com/jcr/article-abstract/29/4/474/1790988
  - https://ideas.repec.org/a/oup/jconrs/v29y2003i4p474-91.html

- id: FP-03
  이름: "Price Fairness: Good and Service Differences and the Role of Vendor Costs"
  저자: Lisa E. Bolton · Joseph W. Alba
  기관: Journal of Consumer Research 33(2), 258~265
  연도: 2006
  등급: C
  근거: 실증
  원문확인: false
  경유: SK-01 원문이 인용한 내용으로만 안다. 이 논문 자체는 초록도 확인하지 못했다.
  결과: |
    어떤 비용이 올랐다고 말하느냐에 따라 받아들이는 정도가 다르다.
    가격 변화와 '결이 맞는(alignable)' 비용일수록 공정하게 느껴진다.
      생산 원가(재료비 등)  → 가격과 결이 맞는다   → 더 공정하게 받아들여진다
      일반 관리비(간접비)    → 결이 덜 맞는다        → 덜 받아들여진다
  한계: |
    ⚠️ C등급이다. 다른 논문이 요약한 것만 봤다. 원 논문의 표본·설계를 모른다.
    쓸 때는 "SK-01 이 인용한 바에 따르면" 으로 밝힌다. 단독으로 인용하지 않는다.
  승급조건: 원문 초록만 확보해도 B, 전문을 열면 A.
  확인한곳:
  - 지식/원전/원문/SK-01-Skimpflation-Outrage-본문.md (Theoretical Contributions 절)

- id: FP-04
  이름: A meta-analysis of price change fairness perceptions
  저자: Farid Tarrahi · Martin Eisend · Florian Dost
  기관: International Journal of Research in Marketing 33(1), 199~203
  연도: 2016
  등급: C
  근거: 실증
  원문확인: false
  결과: |
    가격 변화의 '이유' 가 공정성 판단을 가른다는 이중 자격 원리를
    메타분석으로 다시 확인했다(replicates).
  한계: |
    ⚠️ C등급이다. 서지 정보와 "재현했다" 는 요약만 확보했다.
    효과 크기·포함 논문 수·조절변수를 하나도 모른다.
    쓸 수 있는 건 "메타분석에서도 같은 방향이 나왔다" 는 사실 하나뿐이다.
    숫자는 인용하지 않는다.
  승급조건: 초록만 확보해도 B. sciencedirect 차단.
  확인한곳:
  - https://ideas.repec.org/a/eee/ijrema/v33y2016i1p199-203.html
  - https://www.sciencedirect.com/science/article/abs/pii/S0167811615001238

- id: FP-05
  이름: Culture, Relationship Norms, and Dual Entitlement
  저자: Haipeng (Allan) Chen · Lisa E. Bolton · Sharon Ng · Dongwon Lee · Dian Wang
  기관: Journal of Consumer Research 45(1), 1~20
  연도: 2018
  등급: B
  근거: 실증
  원문확인: false
  결과: |
    ★ 한국 사장님에게 직접 걸리는 연구다.

    이중 자격 원리는 '비대칭 가격' 을 공정하다고 본다 —
    원가가 오르면 값을 올리고, 원가가 내려도 값을 그대로 두는 것.
    이 연구는 그게 문화마다 다르다는 걸 보였다.

      집단주의 문화(interdependent)  비대칭 가격을 덜 공정하다고 본다.
                                     실제로도 비대칭 가격이 덜 흔하다
      개인주의 문화(independent)     비대칭 가격이 '거래 규범' 과 맞아 덜 거슬린다

    이유로 제시된 것은 '공동체 규범(communal norms)' 이다.
    집단주의 문화의 손님은 가게에 **선의(benevolence)** 를 기대한다.
    그런데 값만 올리고 안 내리는 건 그 기대와 어긋난다.

    ★ 그리고 해법도 같이 나왔다 —
    가게가 그 가격 결정을 **선의로 설명하면(frame as benevolent)**
    문화에 따른 차이가 줄어든다.
  한국주의: |
    ⚠️ 한국이 표본에 들어갔는지 확인하지 못했다. 저자 중 한 명이 한국계로 보이나
    그건 근거가 아니다. "한국은 집단주의니까 이렇다" 로 단정하지 않는다.
    쓸 수 있는 건 "문화에 따라 다르다는 게 확인됐고, 한국은 대체로 집단주의로
    분류돼 왔다" 까지다.
  승급조건: 원문을 열어 붙여 주시면 A. 표본 국가 목록이 특히 궁금하다.
  확인한곳:
  - https://academic.oup.com/jcr/article-abstract/45/1/1/4711096
  - https://ideas.repec.org/a/oup/jconrs/v45y2018i1p1-20..html

안쓰기로한것:
- 수치: "기업의 64%는 수요가 늘어 값을 올리면 손님이 못 참는다고 답했고, 71%는 원가가 올라 값을 올리면 참는다고 답했다"
  출처: 이차 요약글(블로그·워킹페이퍼 소개)에서만 봤다
  이유: |
    어느 조사인지, 어느 나라 몇 개 기업인지, 언제 조사한 것인지 추적하지 못했다.
    "1만 2천 개 기업 조사" 라는 말도 같이 도는데 그 원 조사도 못 찾았다.
    숫자가 구체적일수록 원문 없이 쓰면 안 된다.
- 사례: "빵집 주인들은 밀가루·전기·인건비가 오를 때만 값을 올리고, 주말이나
    관광 성수기에 손님이 몰려도 안 올린다고 답했다"
  출처: 워킹페이퍼 소개글에서 인용된 인터뷰 연구
  이유: |
    원 연구(누가 언제 몇 명을 인터뷰했는지)를 특정하지 못했다.
    이야기가 좋을수록 출처를 확인하고 써야 한다.
