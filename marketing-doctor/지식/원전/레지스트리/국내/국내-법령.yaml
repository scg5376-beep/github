원전:
- id: LW-01
  이름: 전자상거래 등에서의 소비자보호에 관한 법률 (전자상거래법)
  기관: 공정거래위원회 소관 · 국가법령정보센터
  연도: "[시행 2026. 7. 21.] [법률 제21312호, 2026. 1. 20., 일부개정]"
  등급: A
  근거: 공식
  원문확인: true
  원문보관: 법령/
  공식문서위치: 확인됨
  공식문서:
  - 이름: 법령 본문
    url: https://www.law.go.kr/법령/전자상거래등에서의소비자보호에관한법률
  전문확인:
  - 제1조~제46조 본문 전체 (2026-09-02, 사장님이 국가법령정보센터 .hwp 를 내려받아 주심)
  - 원문 보관 10파일 · 원본과 글자 단위로 대조해 동일함을 확인했다
  미확인:
  - 부칙 (내려받은 본문 파일에 실려 있지 않았다). 그래서 각 개정의 경과조치를 모른다
  - 시행령·시행규칙(총리령). 제10조 제1항이 "총리령으로 정하는 바에 따라" 로 위임한
    표시 방법과 제13조 제2항 제11호의 대통령령 사항은 이 법에 없다
  결과: |
    ★ 이 창고에서 확인한 사실 (원문 대조 완료)
    · 제10조 제1항 사이버몰 운영자 표시 사항은 여섯 호다 — 상호 및 대표자 성명 /
      영업소가 있는 곳의 주소(소비자 불만 처리 주소 포함) / 전화번호ㆍ전자우편주소 /
      사업자등록번호 / 사이버몰의 이용약관 / 그 밖에 대통령령으로 정하는 사항
      ⚠️ '호스팅서비스 제공자 상호' 와 '통신판매업 신고번호' 는 이 조에 없다.
         신고번호는 제13조 제1항 제3호(표시·광고 시)다. 이전 B등급 정리가 이 둘을
         제10조 항목으로 적었던 것을 원문 확인으로 바로잡았다
    · 제12조 제1항 단서 — 거래횟수·거래규모 등이 공정거래위원회 고시 기준 이하면 신고 제외
    · 제13조 제2항은 열한 개 호. 제2항 제10호가 결제대금예치 선택권 고지
    · 제15조 제1항 — 청약일부터 7일 이내 공급 조치, 선지급식은 대금 지급일부터 3영업일 이내
    · 제17조 제1항 청약철회 7일(서면 수령일 기준·공급이 늦으면 공급일 기준)
      제3항 — 표시·광고와 다르거나 계약과 다르게 이행된 경우 공급받은 날부터 3개월,
      안 날 또는 알 수 있었던 날부터 30일
      제5항 — 다툼이 있으면 통신판매업자가 증명해야 한다 (입증책임 전환)
    · 제18조 제2항 — 환급은 3영업일 이내, 지연 시 연 100분의 40 이내 범위의 지연배상금
      제9항 — 제17조 제1항 반품 비용은 소비자 부담, 위약금·손해배상 청구 금지
      제10항 — 제17조 제3항(다르게 이행된 경우) 반품 비용은 통신판매업자 부담
    · 제21조 제1항 금지행위 일곱 호
    · 제21조의2 온라인 인터페이스 금지행위 다섯 호 (다크패턴, 2024-02-13 신설)
    · 제21조의4 사용후기 정보 공개 의무 (2026-01-20 신설 — 이번 개정)
    · 제20조의4 개인 간 거래 중개업자 의무 (2026-01-20 신설 — 이번 개정)
    · 제35조 — 제17조~제19조를 위반한 약정으로 소비자에게 불리한 것은 효력이 없다
    · 제36조 전속관할 — 소비자 주소지 지방법원
    · 벌칙 제42조 제1호 신고 안 하거나 거짓 신고 3천만원 이하 벌금
      제43조 신원정보·거래조건 거짓 제공 1천만원 이하 벌금
      제45조 제4항 과태료 1천만원 이하 — 제2호 제10조 제1항·제13조 제1항 신원정보 미표시,
      제3호 변경·휴폐업 미신고, 제4호 제13조 제2항 위반, 제8호 제21조의4 위반
    ★ 2027-01-21 시행분을 특정했다 — 제20조의5(국내대리인 지정)과 그에 딸린
      제32조·제45조 부분이다. 국내에 주소·영업소가 없는 사업자가 대상이라
      국내 사장님에게는 걸리지 않는다. (전에 "내용 미확인" 으로 남겼던 항목)
  승급조건: 완료. 다음은 시행령·시행규칙(총리령) 확보.
- id: LW-02
  이름: 통신판매업 신고 면제 기준에 대한 고시
  기관: 공정거래위원회 고시
  연도: "[시행 2022. 4. 5.] [공정거래위원회고시 제2022-4호, 2022. 4. 5., 일부개정.]"
  등급: A
  근거: 공식
  원문확인: true
  원문보관: 법령/
  공식문서위치: 확인됨
  공식문서:
  - url: https://www.law.go.kr/행정규칙/통신판매업신고면제기준에대한고시
  전문확인:
  - 제1조~제4조 및 부칙 전문 (2026-09-02, 사장님이 .hwp 를 내려받아 주심)
  미확인:
  - 개정 이력. 이 고시 본문에는 제2022-4호 부칙만 있어 간이과세자 사유가 언제 들어왔는지
    이 문서만으로는 알 수 없다. 2020-07-29 라는 것은 지자체 보도자료(2차)가 전하는 것이다
  결과: |
    ★ 원문으로 확인한 것
    · 현행 판본은 2022-04-05 시행 제2022-4호다. 이 창고가 "2020-07-29 개정" 을 현행처럼
      적어 뒀던 것을 바로잡았다
    · 제2조 제1항 면제 사유는 둘 — 직전년도 통신판매 거래횟수 50회 미만 /
      부가가치세법 제2조 제4호의 간이과세자
    · ★ 제2조 제2항 — 청약철회 등의 경우에는 거래횟수에 산입하지 아니한다.
      이 항의 존재를 전에는 몰랐다. 취소·반품된 주문은 50회에 안 들어간다는 뜻이다
    · 제3조 재검토 기한 — 2015년 7월 1일 기준 매 3년이 되는 시점마다 타당성 검토
    · 제4조는 삭제됐다
    · 부칙 — 이 고시는 고시한 날부터 시행한다
  승급조건: 완료.
