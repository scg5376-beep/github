- id: LW-05
  이름: 등록면허세 (지방세법 제34조 면허분)
  기관: 지방세 · 시·군·구
  등급: C
  근거: 공식
  원문확인: false
  공식문서위치: 미확인
  결과: |
    통신판매업 신고는 면허분 등록면허세 제3종 — 인구 50만 이상 시 40,500원 · 그 밖의 시 22,500원 ·
    군 12,000원 (+지방교육세 20%) 이라고 세무 블로그가 적었다. 매년 1월 1일 갱신 과세.
    파주시 안내(2014)에 제1종 67,500/45,000/27,000 표가 있어 3단계 지역 구분은 맞다.
    ⚠️ 통신판매업이 제3종이라는 근거 조문(시행령 별표)을 못 봤다 → C. 단독 인용 금지.
  못한것: 지방세법 시행령 면허 종별 별표 원문
  승급조건: 시행령 별표를 열어 종별을 확인하면 B, 조문 붙이면 A.
