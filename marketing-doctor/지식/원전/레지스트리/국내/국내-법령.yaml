  결과: |
    제2조 제1항 — 법 제12조 제1항에 따른 신고를 아니할 수 있는 통신판매업자
      1. 직전년도 동안 통신판매의 거래횟수가 50회 미만인 경우
      2. 부가가치세법상 간이과세자인 경우 (2020-07-29 시행 개정으로 추가 — 원주시 보도자료)
    개정 전에는 "최근 6개월 거래 20회 미만 또는 거래금액 1,200만 원 미만" 이었다고 전해진다
  못한것: 고시 전문. 제2항 이하.
  승급조건: 위 URL 을 열어 붙여 주시면 A.
