    url: https://www.law.go.kr/법령/전자상거래등에서의소비자보호에관한법률
  - 이름: 제17조(청약철회등) 단독 조문
    url: https://law.go.kr/법령/전자상거래등에서의소비자보호에관한법률/제17조
  - 이름: 2026-01-20 개정 이유·주요내용
    url: https://www.law.go.kr/lsInfoP.do?lsiSeq=282793&viewCls=lsRvsDocInfoR
  결과: |
    발췌로 확인한 조문 (원문 대조 못 함 — 큰따옴표 안 씀)
    · 제12조 통신판매업자의 신고. 제4항에 따라 공정위가 신고된 사업자 신원정보를 공개
    · 제13조 신원 및 거래조건에 대한 정보의 제공 — 제2항: 계약체결 전 거래조건 제공
    · 제17조 청약철회 — 계약내용 서면을 받은 날부터 7일. 재화 공급이 더 늦으면 공급받은 날부터
    · 제24조 소비자피해보상보험계약 등(결제대금예치) — 선지급식 통신판매에 구매안전서비스
    · 제10조 사이버몰 운영자의 의무 — 공정위 제재 보도자료(당근마켓·에어비앤비·마이리얼트립)가
      상호·대표자·주소·전화·전자우편·사업자등록번호·호스팅서비스 제공자 상호 표시,
      이용약관 화면을 초기화면에 연결할 의무를 이 조에 근거해 적용했다
    · 2026-01-20 개정 이유: C2C 성장에 따라 통신판매중개업자의 개인판매자 정보 확인·제공 의무 등
      (법률 제21312호, 시행 2026-07-21). 해외사업자 국내대리인 지정·동의의결 도입도 같은 개정으로 전해진다
  못한것: |
    각 조문 전문. 제13조 제1항의 표시 항목 전체. 시행령 제10조(표시 방법) 본문.
    easylaw 가 "2027-01-21 시행" 개정을 예고했는데 어느 조항인지 특정하지 못했다.
  승급조건: 위 URL 을 열어 조문을 붙여 주시면 A. law.go.kr 차단.
