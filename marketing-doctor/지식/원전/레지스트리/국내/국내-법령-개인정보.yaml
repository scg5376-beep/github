  - 이름: 법령 본문
    url: https://www.law.go.kr/법령/개인정보보호법시행령
  전문확인:
  - 제1장~제8장 및 부칙 전문 (2026-09-02, 사장님이 .hwp 를 내려받아 주심). 4파일로 보관,
    원본과 글자 단위로 대조해 동일함을 확인했다 (85,867자)
  미확인:
  - 제32조 제4항이 참조하는 별표 1(보호책임자 자격 요건), 제63조가 참조하는 별표 2(과태료 부과기준).
    본문 파일에 실려 있지 않았다
  - 내려받은 파일에 실린 부칙은 <제36340호, 2026. 5. 19.> 하나뿐이다. 판본 줄의 제36121호와
    번호가 다른데 이유를 확인하지 못했다. 파일에 있는 그대로 보관했다
  결과: |
    ★ 동네 가게에 그대로 걸리는 자리
    · 제32조 제1항 — 법 제31조제1항 단서의 "대통령령으로 정하는 기준" 은
      「소상공인기본법」 제2조제1항에 따른 소상공인이다.
      즉 소상공인은 개인정보 보호책임자를 따로 지정하지 않아도 되고,
      법 제31조 제2항에 따라 사업주 또는 대표자가 보호책임자가 된다
    · 제39조 제1항 — 유출등을 알게 되었을 때 서면등의 방법으로 72시간 이내에 정보주체에게 통지.
      단서 두 호(긴급 조치가 필요한 경우 / 천재지변 등)에 해당하면 사유 해소 후 지체 없이.
      제2항 — 유출 항목·시점을 아직 모르면 아는 것부터 우선 통지하고 확인되는 즉시 추가 통지.
      제3항 — 연락처를 알 수 없으면 홈페이지에 30일 이상 게시로 갈음.
      홈페이지가 없으면 사업장등의 보기 쉬운 장소에 30일 이상 게시
    · 제40조 제1항 — 신고(보호위원회 또는 전문기관)는 셋 중 하나면 72시간 이내.
      1천명 이상 / 민감정보·고유식별정보 / 외부로부터의 불법적인 접근.
      경로가 확인되어 회수·삭제 등으로 권익 침해 가능성이 현저히 낮아지면 신고하지 않을 수 있다.
      제3항 — 전문기관은 한국인터넷진흥원이다 (제40조의2 삭제·차단 요청 기관도 같다)
    · 제31조 제2항 — 처리방침은 인터넷 홈페이지에 지속적으로 게재하여야 한다.
      제3항 — 게재할 수 없으면 넷 중 하나 이상(사업장 게시 / 신문 / 연 2회 이상 간행물 / 계약서 발급)
    · 제31조 제1항 — 법 제30조제1항제8호가 위임한 처리방침 항목 넷
      (처리하는 개인정보의 항목 / 국외 이전 근거 / 제30조 안전성 확보 조치 / 국외 직접 수집 시 국가명)
    · 제30조 제1항 — 안전성 확보 조치 여덟 호. 세부 기준이 LW-07 고시다(제3항)
    · 제16조 파기 방법 — 전자적 파일은 복원 불가능한 영구 삭제, 그 밖의 기록물은 파쇄 또는 소각
    · 제17조 제1항 — 동의를 받을 때 충족해야 할 네 조건(자유로운 의사 / 구체적·명확 /
      쉽게 읽고 이해 / 동의 여부를 명확히 표시할 방법 제공). 제2항 동의 방법 여섯
    · 제17조 제5항 — "서면등의 방법" 은 서면·전자우편·팩스·전화·문자전송 또는 이에 상당하는 방법
    · 제18조 민감정보 · 제19조 고유식별정보(주민등록번호·여권번호·운전면허번호·외국인등록번호) 범위
    · 제21조의2 제1항 — 주민등록번호를 전자적인 방법으로 보관하면 암호화 대상이다 (규모 무관)
    · 제24조 제1항 — CCTV 안내판. 건물 안에 여러 대면 출입구 등 잘 보이는 곳에 한 장으로 갈음 가능
    · 제25조 제1항 — 고정형 영상정보처리기기 운영·관리 방침 여덟 항목
    · 제28조 — 위탁 계약에 넣을 사항 다섯, 제2항 홈페이지에 수탁자를 지속적으로 게재
    ★ 규모 기준이 붙어 동네 가게에 안 걸리는 자리
    · 제15조의3 제1항 이용·제공 내역 통지 — 5만명 이상 민감·고유식별 또는 100만명 이상
    · 제21조 제2항 고유식별정보 정기 조사 — 공공기관 외에는 5만명 이상
    · 제30조 제1항 제3호 나목 인터넷망 차단 — 일일평균 이용자 100만명 이상
    · 제32조 제4항 별표 1 자격 요건 보호책임자 — 연간 매출액등 1,500억원 이상 등
    · 제30조의2 공공시스템 — 공공기관 전용
  승급조건: 완료. 남은 것은 별표 1·2 와 시행규칙이다.
