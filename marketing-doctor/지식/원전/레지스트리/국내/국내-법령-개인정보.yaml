  결과: |
    ★ 원문으로 확인한 것
    · 제29조 안전조치의무 — 내부 관리계획 수립, 접속기록 보관 등 대통령령으로 정하는 바에 따라
      기술적ㆍ관리적 및 물리적 조치
    · 제30조 제1항 처리방침 항목 (1·2·3·3의2·3의3·4·4의2·5·6·7·8 — 열한 개 호)
      제3항 — 처리방침과 계약 내용이 다르면 정보주체에게 유리한 것을 적용한다
      제4항 — 보호위원회가 작성지침을 정하여 준수를 권장할 수 있다
    · 제31조 제2항 — 보호책임자를 지정하지 아니하면 사업주 또는 대표자가 보호책임자가 된다
    · 제34조 통지 항목 일곱. 제4항 보호위원회 또는 전문기관에 신고
    · 제39조 제1항 — 손해배상. 개인정보처리자가 고의ㆍ과실 없음을 입증하지 못하면 면책되지 않는다
    · 제16조 제3항ㆍ제22조 제5항 — 최소정보 외의 동의를 하지 않는다는 이유로 재화·서비스 제공을
      거부하면 3천만원 이하 과태료(제75조 제2항 제1호)
    · 과태료 — 처리방침 미수립·미공개 1천만원 이하(제75조 제4항 제8호),
      안전조치·파기·유출 통지·신고·보호책임자 미지정은 3천만원 이하(제75조 제2항)
    ★ 2026-03-10 개정(시행 2026-09-11) 중 확인한 것
    · 제30조의3 신설 — 사업주 또는 대표자가 최종적인 책임자로서 전문 인력과 충분한 예산 지원 등
      총괄적인 관리 조치를 실효성 있게 하여야 한다
    · 제34조 제2항 신설 — 대통령령으로 정하는 유출등의 "가능성" 이 있음을 알게 되었을 때에도
      지체 없이 알려야 한다
    · 제31조 제3항 신설 — 대통령령 기준에 해당하는 처리자는 보호책임자 지정·변경·해제에
      이사회 의결을 거치고 보호위원회에 신고해야 한다
    ⚠️ 2차 자료가 틀렸던 것 — "과징금 상한이 3%에서 10%로 올랐다" 는 부정확하다.
      제64조의2 제1항은 여전히 전체 매출액의 100분의 3 이고, 2026-03-10 에 신설된 제2항이
      3년 내 반복(고의·중과실) 또는 고의·중과실로 피해 규모 1천만명 이상인 경우에만
      100분의 10 이다. 동네 가게에 적용될 자리가 아니다
  승급조건: 완료. 위임 조항은 LW-11 에서 받는다.
