  공식문서위치: 확인됨
  공식문서:
  - 이름: 법령 본문
    url: https://www.law.go.kr/법령/개인정보보호법
  전문확인:
  - 제1조~제75조 및 부칙 전문 (2026-09-02, 사장님이 .hwp 를 내려받아 주심). 5파일로 보관,
    원본과 글자 단위로 대조해 동일함을 확인했다 (95,149자)
  - 2026-03-10 개정분이 같은 조문의 두 번째 판으로 함께 실려 있다. 조문 끝에 붙은
    시행일 표시(2026년 9월 11일)로 구분한다
  미확인:
  - 시행령·시행규칙. 유출 통지 72시간, 안전조치 세부, 보호책임자 지정 기준(종업원 수·매출액),
    처리방침 공개 방법이 전부 대통령령 위임이다 → 이 창고에서 72시간은 아직 B 다
  결과: |
    ★ 원문으로 확인한 것
    · 제29조 안전조치의무 — 내부 관리계획 수립, 접속기록 보관 등 대통령령으로 정하는 바에 따라
      기술적ㆍ관리적 및 물리적 조치
    · 제30조 제1항 처리방침 항목 (1·2·3·3의2·3의3·4·4의2·5·6·7·8 — 열한 개 호)
      제3항 — 처리방침과 계약 내용이 다르면 정보주체에게 유리한 것을 적용한다
      제4항 — 보호위원회가 작성지침을 정하여 준수를 권장할 수 있다
    · 제31조 제2항 — 보호책임자를 지정하지 아니하면 사업주 또는 대표자가 보호책임자가 된다
    · 제34조 통지 항목 일곱. 제4항 보호위원회 또는 전문기관에 신고
    · 제39조 제1항 — 손해배상. 개인정보처리자가 고의ㆍ과실 없음을 입증하지 못하면 면책되지 않는다
    · 제16조 제3항ㆍ제22조 제5항 — 최소정보 외의 동의를 하지 않는다는 이유로 재화·서비스 제공을
      거부하면 3천만원 이하 과태료(제75조 제2항 제1호)
    · 과태료 — 처리방침 미수립·미공개 1천만원 이하(제75조 제4항 제8호),
      안전조치·파기·유출 통지·신고·보호책임자 미지정은 3천만원 이하(제75조 제2항)
    ★ 2026-03-10 개정(시행 2026-09-11) 중 확인한 것
    · 제30조의3 신설 — 사업주 또는 대표자가 최종적인 책임자로서 전문 인력과 충분한 예산 지원 등
      총괄적인 관리 조치를 실효성 있게 하여야 한다
    · 제34조 제2항 신설 — 대통령령으로 정하는 유출등의 "가능성" 이 있음을 알게 되었을 때에도
      지체 없이 알려야 한다
    · 제31조 제3항 신설 — 대통령령 기준에 해당하는 처리자는 보호책임자 지정·변경·해제에
      이사회 의결을 거치고 보호위원회에 신고해야 한다
    ⚠️ 2차 자료가 틀렸던 것 — "과징금 상한이 3%에서 10%로 올랐다" 는 부정확하다.
      제64조의2 제1항은 여전히 전체 매출액의 100분의 3 이고, 2026-03-10 에 신설된 제2항이
      3년 내 반복(고의·중과실) 또는 고의·중과실로 피해 규모 1천만명 이상인 경우에만
      100분의 10 이다. 동네 가게에 적용될 자리가 아니다
  승급조건: 완료. 다음은 시행령(72시간·안전조치 세부).
- id: LW-07
  이름: 개인정보의 안전성 확보조치 기준
  기관: 개인정보보호위원회 고시 제2026-9호
  연도: "[시행 2026. 7. 1.] [개인정보보호위원회고시 제2026-9호, 2026. 7. 1., 일부개정.]"
  등급: A
  근거: 공식
  원문확인: true
  원문보관: 법령/
  공식문서위치: 확인됨
  공식문서:
  - url: https://www.law.go.kr/행정규칙/개인정보의안전성확보조치기준
  전문확인:
  - 제1조~제19조 및 부칙 전문 (2026-09-02, 사장님이 .hwp 를 내려받아 주심)
  미확인:
  - 제6조의2 제2항이 참조하는 [별표]. 본문 파일에 실려 있지 않았다
  - 이 고시가 위임받은 근거인 개인정보 보호법 시행령(제16조제2항·제30조·제30조의2) 자체
  결과: |
    ★ 원문으로 확인한 것 — 소상공인에게 걸리는 자리
    · 제3조 적용 원칙 — 보유 수·유형·영향을 고려해 스스로의 환경에 맞는 조치를 적용
    · 제4조 제1항 단서 — 1만명 미만의 정보주체에 관하여 개인정보를 처리하는
      소상공인ㆍ개인ㆍ단체는 내부 관리계획 수립ㆍ시행을 생략할 수 있다 (기존 B 정보가 맞았다)
    · 제5조 제3항 — 접근 권한 부여·변경·말소 내역을 최소 3년간 보관
    · 제5조 제4항 — 정당한 사유가 없는 한 개인정보취급자 별로 계정을 발급하고 공유되지 않게
    · 제6조 제3항 — 인터넷 홈페이지·P2P·공유설정 등으로 권한 없는 자에게 공개·유출되지 않도록 조치
    · 제6조 제4항 — 일정시간 미사용 시 자동 접속 차단
    · 제6조 제5항 — 업무용 모바일 기기 분실·도난 대비 비밀번호 설정
    · 제7조 제1항 — 비밀번호·생체인식정보 등 인증정보는 암호화. 비밀번호 저장은 일방향
    · 제7조 제4항 — 개인정보를 인터넷망 구간으로 송·수신할 때 암호화 (HTTPS 의 법적 근거)
    · 제8조 제1항 — 접속기록 1년 이상. 5만명 이상이거나 고유식별정보·민감정보를 처리하면 2년 이상
    · 제9조 — 보안 프로그램 자동 업데이트 또는 일 1회 이상
    · 제10조 제2항 — 서류·보조저장매체는 잠금장치가 있는 안전한 장소에
      제3항 단서 — 별도 개인정보처리시스템 없이 업무용 컴퓨터·모바일로만 처리하면 반출입 통제 미적용 가능
    · 제13조 파기 방법 — 완전파괴 / 전용 소자장비 / 복원되지 않도록 초기화 또는 덮어쓰기
    ★ 소상공인에게 안 걸리는 자리 (규모 기준이 붙어 있다)
    · 제6조의2 인터넷망 차단 — 일일평균 이용자 100만명 이상
    · 제7조 제6항 암호 키 관리 절차 — 10만명 이상 대기업·중견기업·공공기관 또는 100만명 이상 중소기업·단체
    · 제11조 재해·재난 대비 — 같은 규모 기준
    · 제3장(제14조~제18조) 전체 — 공공시스템 운영기관
    · 부칙 단서 — 제15조제5호와 제18조는 2027-01-01 시행. 둘 다 공공시스템 조항이다
