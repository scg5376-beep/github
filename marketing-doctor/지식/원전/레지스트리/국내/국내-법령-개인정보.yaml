  결과: |
    ★ 원문으로 확인한 것 — 소상공인에게 걸리는 자리
    · 제3조 적용 원칙 — 보유 수·유형·영향을 고려해 스스로의 환경에 맞는 조치를 적용
    · 제4조 제1항 단서 — 1만명 미만의 정보주체에 관하여 개인정보를 처리하는
      소상공인ㆍ개인ㆍ단체는 내부 관리계획 수립ㆍ시행을 생략할 수 있다 (기존 B 정보가 맞았다)
    · 제5조 제3항 — 접근 권한 부여·변경·말소 내역을 최소 3년간 보관
    · 제5조 제4항 — 정당한 사유가 없는 한 개인정보취급자 별로 계정을 발급하고 공유되지 않게
    · 제6조 제3항 — 인터넷 홈페이지·P2P·공유설정 등으로 권한 없는 자에게 공개·유출되지 않도록 조치
    · 제6조 제4항 — 일정시간 미사용 시 자동 접속 차단
    · 제6조 제5항 — 업무용 모바일 기기 분실·도난 대비 비밀번호 설정
    · 제7조 제1항 — 비밀번호·생체인식정보 등 인증정보는 암호화. 비밀번호 저장은 일방향
    · 제7조 제4항 — 개인정보를 인터넷망 구간으로 송·수신할 때 암호화 (HTTPS 의 법적 근거)
    · 제8조 제1항 — 접속기록 1년 이상. 5만명 이상이거나 고유식별정보·민감정보를 처리하면 2년 이상
    · 제9조 — 보안 프로그램 자동 업데이트 또는 일 1회 이상
    · 제10조 제2항 — 서류·보조저장매체는 잠금장치가 있는 안전한 장소에
      제3항 단서 — 별도 개인정보처리시스템 없이 업무용 컴퓨터·모바일로만 처리하면 반출입 통제 미적용 가능
    · 제13조 파기 방법 — 완전파괴 / 전용 소자장비 / 복원되지 않도록 초기화 또는 덮어쓰기
    ★ 소상공인에게 안 걸리는 자리 (규모 기준이 붙어 있다)
    · 제6조의2 인터넷망 차단 — 일일평균 이용자 100만명 이상
    · 제7조 제6항 암호 키 관리 절차 — 10만명 이상 대기업·중견기업·공공기관 또는 100만명 이상 중소기업·단체
    · 제11조 재해·재난 대비 — 같은 규모 기준
    · 제3장(제14조~제18조) 전체 — 공공시스템 운영기관
    · 부칙 단서 — 제15조제5호와 제18조는 2027-01-01 시행. 둘 다 공공시스템 조항이다
