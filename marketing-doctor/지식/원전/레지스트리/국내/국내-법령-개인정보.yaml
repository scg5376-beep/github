- id: LW-11
  이름: 개인정보 보호법 시행령
  기관: 개인정보보호위원회 소관 · 국가법령정보센터
  연도: "[시행 2026. 8. 20.] [대통령령 제36121호, 2026. 2. 19., 일부개정]"
  등급: A
  근거: 공식
  원문확인: true
  원문보관: 법령-개인정보/
  공식문서위치: 확인됨
