- id: LW-10
  이름: 전자상거래 등에서의 소비자보호에 관한 법률 시행령
  기관: 공정거래위원회 소관 · 국가법령정보센터
  연도: "[시행 2026. 7. 21.] [대통령령 제36507호, 2026. 7. 20., 일부개정]"
  등급: A
  근거: 공식
  원문확인: true
  원문보관: 법령/
  공식문서위치: 확인됨
  공식문서:
  - url: https://www.law.go.kr/법령/전자상거래등에서의소비자보호에관한법률시행령
  전문확인:
  - 제1조~부칙 전문 (2026-09-02, 사장님이 .hwp 를 내려받아 주심). 2파일로 보관,
    원본과 글자 단위로 대조해 동일함을 확인했다 (23,777자)
  미확인:
  - 시행규칙(총리령). 신고서·변경신고서·휴폐업신고서 서식과 신고증 양식이 거기 있다
  결과: |
    ★ 법에서 "대통령령으로 정한다" 로 끊겨 있던 자리를 채웠다
    · 제11조의4 사이버몰의 표시 — 법 제10조 제1항 제6호의 대통령령 사항은
      호스팅서비스를 제공하는 자의 상호 하나다
      → 이 창고가 "시행령에 있을 가능성이 크다" 고 적어 뒀던 추정이 맞았다
    · 제15조 신고사항 — 법 제12조 제1항 제3호의 대통령령 사항은
      사업자의 성명 및 주민등록번호(개인인 경우만)
    · 제20조 계약서 기재사항 — 법 제13조 제2항 제11호의 대통령령 사항은 둘.
      교환·반품 비용 등 추가 부담이 있으면 그 내용과 금액 /
      판매일시·지역·수량·인도지역 등 판매조건 제한이 있으면 그 내용
    · ★ 제21조의3 지연배상금의 이율 = 연 100분의 15
      (법 제18조 제2항은 "연 100분의 40 이내의 범위에서 대통령령" 이라고만 했다)
    · 제20조의2 정기결제 증액·유료 전환 동의·고지 기간 = 30일 전
    · 제27조의2 팝업 반복 요구 제한 기간 = 7일
    · 제21조 청약철회 제한(법 제17조 제2항 제6호) — 주문에 따라 개별 생산되는 재화등으로서
      사전에 별도 고지하고 소비자의 서면 동의를 받은 경우
    ★ 절차 숫자
    · 제13조 신고 — 선지급식이면 결제대금예치·보험 증명 서류를 함께 제출.
      법인 등기사항증명서와 사업자등록증명은 행정정보 공동이용으로 확인한다
      (동의하지 않으면 직접 제출). 신고증을 교부한다
    · 제16조 변경신고 — 변경사항이 발생한 날부터 15일 이내
    · 제17조 휴업·폐업·재개 — 미리 신고. 폐업은 종전 신고증을 첨부
    ★ 2026-07-20 신설 — 사용후기 공개 방법이 구체화됐다
    · 제27조의3 — 사용후기를 게시하면 네 가지를 소비자가 사용후기를 확인할 수 있는
      첫 화면에서 볼 수 있도록 공개해야 한다 (공간 제약이 있으면 첫 화면과 직접 연결되는 화면)
      1 작성 권한이 있는 자의 범위 / 2 게시기간 / 3 등급평가 기준과 등급에 따른 효과 /
      4 삭제 기준 및 삭제 시 이의제기 절차
  승급조건: 완료. 다음은 시행규칙(총리령).
