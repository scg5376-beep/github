  미확인:
  - 변경신고·휴폐업 신고 페이지 본문은 아직 발췌만 봤다
  - 근거로 적힌 시행령 제13조 · 시행규칙 제8조 제1항 본문
  결과: |
    ★ 원문으로 확인한 것
    · 신청방법 인터넷·방문 / 신청자격 본인 또는 대리인 (온라인은 대리인 신청 불가)
    · 수수료 없음
    · 처리기간 총 3일. 주된 사무소가 국내면 시·군·구·특별자치도가 접수·처리,
      외국이면 공정거래위원회가 접수·처리
    · 신청서는 시행규칙 별지 서식 1호
    · ★ 민원인이 낼 서류는 구매안전서비스 이용 확인증 하나이고,
      "선지급식 통신판매를 하려는 경우만 해당" 이라는 단서가 붙어 있다
    · 사업자등록증명과 법인등기부등본(법인)은 담당공무원이 행정정보공동이용으로 확인한다.
      본인정보 제공에 동의하지 않으면 민원인이 낸다
    · 공정거래위원회가 신고한 사업자의 신원정보(전화번호, 주소 등)를 ftc.go.kr 에 공개한다
    · 근거법령 — 법 제12조 제1항 · 시행령 제13조 · 시행규칙 제8조 제1항
