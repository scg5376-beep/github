    url: https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7777&mi=2444
  - 이름: 국세청 간이과세 Q&A
    url: https://call.nts.go.kr/call/qna/selectQnaInfo.do?ctgId=CTG11937&mi=1329
  - 이름: 현금영수증 발급의무
    url: https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7796&mi=2471
  결과: |
    · 사업자등록은 사업장마다. 사업 개시일부터 20일 이내 신청, 개시 전 신청 가능 (제8조 제1항 단서 — easylaw)
    · 직전 연도 연 환산 공급대가 1억 400만 원 이상이면 다음 해 7월 1일 일반과세자 전환
      (2024-07 부터 8,000만 → 1억 400만. 부동산임대·과세유흥장소 4,800만) — 네이버페이 비즈 안내
    · 현금영수증 의무발행업종에 전자상거래 소매업 포함 — 건당 10만 원 이상 현금 거래 시 발급
      (국세청 유권해석: 카드 결제는 대상 아님, 현금 수령 시 의무)
  못한것: 조문 전문. 전자상거래 소매업이 의무발행업종에 들어간 시행일(2021-01-01 로 보도되나 원 보도 미확인)
  승급조건: 국세청 페이지를 열어 붙여 주시면 A.
