  결과: |
    바이브 코딩은 누구나 소프트웨어를 만들 수 있게 바닥을 올리는 것, 에이전틱 엔지니어링은
    전문 소프트웨어의 품질 기준을 지키는 것이라고 구분한 것으로 전해진다.
    생성 코드를 그대로 받지 않고 명세·계획 감독·diff 검토·테스트·권한 관리를 사람이 한다.
  못한것: 본인 글 원문
  승급조건: 위 URL 을 열어 붙여 주시면 A.
