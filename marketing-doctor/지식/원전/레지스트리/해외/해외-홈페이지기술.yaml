  - url: https://www.veracode.com/wp-content/uploads/2025_GenAI_Code_Security_Report_Final.pdf
  결과: |
    100개 넘는 LLM 이 Java·JavaScript·Python·C# 으로 만든 코드의 45% 에 보안 결함이 있었다고
    전해진다. 새 모델·큰 모델이라고 더 안전하지 않았다. ⚠️ 보안 제품 판매사의 자체 보고서다 —
    근거 등급은 실무. 동료심사 아님.
  못한것: 과제 설계·판정 기준
  승급조건: PDF 를 열어 붙여 주시면 A (등급은 실무 그대로).

- id: WT-06
  이름: CVE-2025-48757 — Lovable 생성 앱의 Supabase RLS 미설정
  저자: Matan Getz (공개) · 초기 스캔은 독립 연구자
  연도: 2025-06-04 공개 (스캔은 2025-01~)
  등급: B
  근거: 실증
  원문확인: false
  공식문서위치: 미확인
  결과: |
    Lovable 쇼케이스 앱 1,645개를 스캔해 170개(10.3%)에서 행 수준 보안(RLS) 미설정이 발견됐고,
    익명 키만으로 이름·이메일·전화·주소·금융 기록이 읽혔다고 전해진다. CVSS 8.26.
    2차 자료 여럿(superblocks · vibeappscanner · brinztech)이 같은 숫자.
  못한것: CVE 원문(NVD)과 최초 공개 글. 그래서 공식문서위치 미확인.
  승급조건: NVD 항목 또는 공개 글을 열어 붙여 주시면 A.
  확인한곳:
  - https://www.superblocks.com/blog/lovable-vulnerabilities
  - https://vibeappscanner.com/lovable-vulnerability-cve-2025-48757

