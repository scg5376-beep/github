- id: WT-04
  이름: Do Users Write More Insecure Code with AI Assistants?
  저자: Neil Perry · Megha Srivastava · Deepak Kumar · Dan Boneh
  연도: 2023 (ACM CCS 2023, 코펜하겐)
  기관: Stanford
  등급: B
  근거: 실증
  원문확인: false
  공식문서위치: 확인됨
  공식문서:
  - url: https://arxiv.org/abs/2211.03622
  - url: https://dl.acm.org/doi/10.1145/3576915.3623157
  - 이름: NSF 공개 저장소
    url: https://par.nsf.gov/biblio/10472235
  결과: |
    AI 코드 어시스턴트(codex-davinci-002)를 쓴 참가자가 안 쓴 쪽보다 유의하게 덜 안전한 코드를 썼고,
    자기 코드가 안전하다고 믿는 비율은 더 높았다고 전해진다. AI 를 덜 믿고 프롬프트를 더 다듬은
    참가자가 결과가 나았다. 동료심사 학회(CCS) 논문.
  못한것: 표본 수·과제 종류·효과 크기 원문 (모든 경로 차단)
  승급조건: arXiv PDF 를 열어 붙여 주시면 A.
  확인한곳:
  - https://icml.cc/virtual/2023/28917
  - https://github.com/neilaperry/do-users-write-more-insecure-code-with-ai-assistants

- id: WT-05
  이름: 2025 GenAI Code Security Report
  저자: Veracode
  연도: 2025 (2025-07 발표, 2025-10 갱신, 2026 봄 갱신)
  등급: B
  근거: 실무
  원문확인: false
  공식문서위치: 확인됨
