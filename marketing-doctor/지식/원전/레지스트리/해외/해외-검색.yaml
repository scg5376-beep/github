- id: SI-01
  이름: A Taxonomy of Web Search
  저자: Andrei Broder
  기관: IBM Research · SIGIR Forum
  연도: 2002
  등급: B
  근거: 실증
  원문확인: false
  자료: AltaVista 이용자 설문 + 질의 로그 분석
  결과: "검색을 '질의 뒤에 있는 필요' 로 세 갈래로 나눴다.\n  정보형 informational   무언가를 알고 싶다        39~48%\n  거래형 transactional\
    \   무언가를 하려 한다        22~36%\n  이동형 navigational    특정 사이트로 가려 한다    20~24.5%\nRose & Levinson (2004)\
    \ 이 하위 분류로 다듬었다.\n"
  확인한곳:
  - https://sigir.org/files/forum/F2002/broder.pdf
  - https://dl.acm.org/doi/pdf/10.1145/792550.792552

- id: RD-01
  이름: 웹에서 사람이 글을 읽는 방식 (아이트래킹 연구)
  저자: Nielsen Norman Group
  연도: 2006 F-패턴 최초 보고 · 이후 20년간 반복 확인
  등급: B
  근거: 실증
  원문확인: false
  성격주의: |
    ⚠️ 상업 UX 연구기관이다. 동료심사를 거친 학술 논문이 아니다.
    자체 아이트래킹 실험을 근거로 든다. 이 점을 밝히고 인용한다.
  결과: |
    사람은 웹에서 '읽지' 않고 '훑는다'. 평균적으로 페이지 내용의 20~28% 만 읽는다.
    최초 실험은 232명 아이트래킹. 20년간 결과가 일관되게 재확인됐다.
    훑는 방식은 네 가지로 정리된다.
      F 패턴        위쪽을 가로로, 그 아래를 짧게 가로로, 그다음 왼쪽만 세로로
      케이크층 패턴  소제목만 따라 내려가다 관심 있는 데서 멈춘다
      점박이 패턴    찾는 낱말만 튀어 다닌다
      몰입 패턴      실제로 처음부터 끝까지 읽는다 (드물다)
    어떤 패턴이 나오는지는 페이지가 어떻게 생겼느냐에 달렸다.
  확인한곳:
    - https://www.nngroup.com/articles/f-shaped-pattern-reading-web-content-discovered/
    - https://www.nngroup.com/articles/text-scanning-patterns-eyetracking/

- id: SI-02
  이름: 검색 의도 분포 최신 조사 (상업 조사기관)
  저자: Semrush · Datos · Profound
  연도: 2025~2026
  등급: B
  근거: 실증
  원문확인: false
  성격주의: |
    ⚠️ 셋 다 상업 조사기관·SEO 도구 회사다. 동료심사 논문이 아니다.
    자체 데이터 규모는 크지만 분류 기준을 공개하지 않는다.
    "연구에 따르면" 이 아니라 "OO 사의 분석에서" 로 인용한다.
  확인한것: |
    [Semrush 2026] 184억 건 질의 · 142개국
      정보형 57.3% (52% 에서 상승)
      거래형 전년 대비 +19% 성장 · 이동형 -6% 감소
      건강 · AI 활용법 · 재무설계 질의가 44% 급증한 것이 정보형 상승을 이끌었다

    [Datos, The State of Search Q1 2025]
      이동형 약 30%
      거래형 0.82%  ← Semrush·Broder 와 극단적으로 어긋난다

    [Profound 2025] ChatGPT 프롬프트 5,000만 건 이상 분석
      생성형 37.5% · 정보형 32.7% · 무의도 12.1%
      상업형 9.5% · 거래형 6.1% · 이동형 2.1%
      → 이동형이 32% 에서 2% 로 붕괴했다.
        AI 안에서는 '어디로 가려는' 검색이 필요 없기 때문이다.
      → '생성형' 이라는 새 유형이 등장했다. 찾는 게 아니라 만들어 달라는 것.
  확인한곳:
    - https://www.semrush.com/blog/semrush-ai-overviews-study/
    - https://www.tryprofound.com/blog/chatgpt-intent-landmark-study
    - https://statista.com/statistics/1614663/usa-search-intent-google-chatgpt

- id: VR-01
  이름: "What Makes Online Content Viral?"
  저자: Jonah Berger, Katherine L. Milkman
  기관: Journal of Marketing Research
  연도: 2012
  등급: B
  근거: 실증
  원문확인: false
  S후보: true
  자료: 뉴욕타임스 3개월치 전체 기사와 '가장 많이 이메일로 공유된 기사' 목록
  결과: |
    퍼짐은 부분적으로 '생리적 각성(arousal)' 이 이끈다.
    감정이 좋으냐 나쁘냐(valence)보다 '각성 수준' 이 중요하다.
      높은 각성  경외(awe) · 분노 · 불안   → 잘 퍼진다
      낮은 각성  슬픔                      → 덜 퍼진다
    긍정 콘텐츠가 부정보다 더 잘 퍼지되, 각성 수준이 그만큼 중요하다.
  영향: 10년 영향력상 수상. 1,300회 이상 인용.
  확인한곳:
    - https://journals.sagepub.com/doi/10.1509/jmr.10.0353
    - http://jonahberger.com/wp-content/uploads/2013/02/ViralityB.pdf
    - https://www.socialsciencespace.com/2023/05/a-viral-paper-on-determining-what-makes-online-content-viral/

- id: GE-01
  이름: "GEO: Generative Engine Optimization"
  저자: Pranjal Aggarwal · Vishvak Murahari · Tanmay Rajpurohit · Ashwin Kalyan · Karthik Narasimhan · Ameet Deshpande
  기관: KDD 2024 (ACM SIGKDD, 데이터마이닝 최상위 학회) · arXiv 2311.09735
  연도: 2024 (프리프린트 2023-11)
  등급: B
  근거: 실증
  원문확인: false
  역할: "'GEO(생성형 엔진 최적화)' 라는 말이 나온 원 논문이다. 업계 용어의 출처."
  방법: |
    GEO-bench 라는 벤치마크를 만들어, 소스 텍스트를 아홉 가지 방법으로 고쳐 보고
    생성형 엔진 답변에서의 노출을 쟀다.
  결과: |
    시험한 아홉 가지 — 권위 있는 어조 · 통계 추가 · 키워드 스터핑 · 출처 인용 ·
    인용문 추가 · 쉬운 표현 · 문장 다듬기 · 특이한 단어 추가 · 전문 용어 추가

    잘 통한 것
      통계 추가 · 인용문 추가 — 모든 지표에서 개선. 기준 대비 최대 41% / 28%
      문장 다듬기 · 쉽게 쓰기 — 노출 15~30% 상승
      전체적으로 최대 40% 까지 노출이 올랐다고 보고한다
    ★ 안 통한 것
      키워드 스터핑 — 전통적 SEO 기법인데 잘 작동하지 않았다
    효과는 분야마다 달랐고, 분야별 최적화가 필요하다고 밝힌다.
  한계: |
    ★ 이 숫자들은 나중에 강하게 비판받았다. → GE-02
    비판 요지 — 이긴 기법이 전부 '내용을 더한' 것이고 나머지는 문장만 손봤다.
    모델이 지어낸 인용·통계를 허용했다. 출처 다섯 개 고정 풀이라 제로섬이라
    상대 이득이 부풀려진다. 그리고 '이미 후보에 들어와 있는' 상태를 전제로 한다.
  승급조건: arXiv 2311.09735 또는 ACM DL 원문. arxiv·dl.acm·openreview·ar5iv 전부 차단.
  확인한곳:
  - https://arxiv.org/abs/2311.09735
  - https://dl.acm.org/doi/10.1145/3637528.3671900
  - https://collaborate.princeton.edu/en/publications/geo-generative-engine-optimization/

- id: GE-02
  이름: "Optimizing Visibility in Generative Engines: A Critical Survey of Generative Engine Optimization (2023-2026)"
  기관: arXiv 2607.14035
  연도: 2026-07-15 판
  등급: B
  근거: 실증
  역할: GE-01 을 포함한 GEO 연구 45편을 검토한 비판적 서베이. 이 묶음의 반증 축이다.
  원문확인: false
  자료: 2023-11 ~ 2026-07 사이 연구 45편 (EMNLP 게재 프리프린트 1편 포함) + 관련 RAG·평가 연구
  결과: |
    ★ 핵심 결론 (여러 요약이 같은 문장으로 전한다)
      "already-retrieved content can causally alter its citation or use,
       but no reviewed technique shows a stable, longitudinal, cross-platform
       causal effect on organic discoverability or downstream behavior"
      → 이미 검색돼 후보에 들어온 콘텐츠는 인용 여부를 바꿀 수 있다.
        그러나 애초에 발견되게 만드는 데는 어떤 기법도 안정적·종단적·플랫폼 교차
        인과 효과를 보이지 않았다.

    GE-01 에 대한 평가
      이득은 그 실험 설정 안에서는 유효하나 '이미 고정된 맥락 안에 소스가 들어와
      있는 상태' 를 전제로 한다. 자연 발견성도, 지속적 트래픽 효과도 입증하지 않는다.

    방법론 비판
      · 이긴 기법은 전부 내용을 '추가' 했고 나머지는 기존 텍스트만 손봤다
      · 방법이 모델이 지어낸 인용·통계를 허용했다
      · 출처 다섯 개 고정 풀이라 제로섬이 되어 상대 이득이 부풀려진다

    플랫폼 교차 랭킹은 없다
      일반 검색 결과에 보이는 사이트가 AI 개요에는 없을 수 있고,
      Perplexity 가 인용하는 도메인을 ChatGPT 는 한 번도 안 쓸 수 있다.

    GEO 를 하나의 랭킹 과제가 아니라 확률적이고 부분 관측만 되는 파이프라인으로 본다
    (검색 활성화 · 크롤링/색인 · 검색 · 재순위와 맥락 배분 · 인용 · 부각 ·
     사실 흡수 · 충실도 · 이용자 행동).
  못한것: |
    원문 미확인 (arxiv 차단). 45편 목록과 각 편의 평가를 못 봤다.
    한 매체가 "GEO 재작성이 페이지의 AI 검색 노출을 16% 깎을 수 있다" 는 제목으로
    이 서베이를 보도했으나, 무엇을 어떤 조건에서 잰 수치인지 확인하지 못했다.
  승급조건: arXiv 2607.14035 원문. arxiv 차단.
  확인한곳:
  - https://arxiv.org/abs/2607.14035
  - https://www.alphaxiv.org/abs/2607.14035v1

안쓰기로한것:
- 수치: "GEO 재작성이 페이지의 AI 검색 노출을 16% 깎는다"
  출처: 업계 매체가 GE-02 를 보도한 기사 제목
  이유: |
    방향은 그럴듯하나 무엇을 어떤 조건에서 잰 것인지 확인하지 못했다.
    기사 본문도 열지 못했다(ppc.land 차단). 숫자는 쓰지 않고
    "재작성이 오히려 노출을 깎을 수 있다는 보도가 있다" 까지만 쓴다.

