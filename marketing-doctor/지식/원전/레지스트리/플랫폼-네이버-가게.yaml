  - 이름: 업체 신규등록 방법
    url: https://help.naver.com/service/30026/contents/20366
  결과: |
    ① 순위 요소 — 23472 전문에서 확인했다. 문장이 둘로 나뉘어 있다.

       앞 문장: "검색 질의에 대한 업체 유사도, 검색질의에 대한 카테고리와 업체의
                인기도, 거리, 정보의 충실성 등을 감안하여 결정합니다."
       뒷 문장: "실제 이용자의 경험을 반영한 방문 리뷰 텍스트와 사진 등의 다양한
                품질 요소와 플레이스에서 자체 수집하는 검색 데이터를 복합적이고
                종합적으로 검토하여 반영하고 있습니다."

       ★ '등' 뒤에 무엇이 있는지 이제 일부 안다 —
         방문 리뷰의 텍스트와 사진 · 플레이스 자체 수집 검색 데이터.
       ★ 여기서 말하는 '사진' 은 **방문 리뷰에 딸린 사진**이다.
         업체가 등록한 대표사진이라고 쓰여 있지 않다. 섞지 않는다.

    ② "노출 순서는 고정된 것이 아니며, 수시로 변경될 수 있습니다."
       → 순위가 안 오른다고 뭘 잘못했다고 단정할 수 없다는 뜻이다.

    ③ 두 문서가 같은 요소를 다르게 부른다 → ../불일치.md
       23472  "업체 유사도"        23473  "검색어와 정보의 유사도"
       23472  "카테고리와 업체의 인기도"  23473  "업체와 카테고리 인기도"
       SEO 운영원칙은 23472 와 같은 문장을 쓴다. 23473 만 혼자 다르다.

    ③b 구성 요소는 넷 + 하나였다 (SEO 운영원칙이 표로 정리)
       유사도 · 인기도 · 거리 · 정보의 충실성   ← 올려주는 쪽
       검색 품질 확보(어뷰징 모니터링)          ← 걸러내는 쪽
       ★ 전에 "다섯 번째를 확인 못 했다" 고 적어 뒀는데,
         다섯 번째는 랭킹 요소가 아니라 어뷰징 모니터링이었다.
         블로그 쪽(C-Rank·D.I.A. + 변질·스팸 로직)과 구조가 같다.

    ③c 요소마다 무엇을 보는지 (SEO 운영원칙 전문)
       유사도    "플레이스 업체 설명과 리뷰를 분석하여 의미 기반 매칭을 하고 있기
                 때문에 플레이스와 관련된 리뷰가 풍부할수록 다양한 검색 결과에
                 노출될 수 있습니다"  ← 리뷰가 검색어 재료로 쓰인다
       인기도    "해당 업체의 언급수, 이미지수, 클릭수 등 다양한 요소로 결정"
                 "인기도가 높다면 사용자 위치와 더 먼 거리여도 검색결과 상단에
                  우선 노출될 수 있습니다"  ← 거리를 이길 수 있다
       카테고리  "사용자가 검색하고 많이 찾은 카테고리를 우선"
       충실성    사업주 의무로 명시 — "실제 현장을 사실에 맞게 충실히 반영"

    ③d 순위를 높이는 방법 (네이버가 제시한 것 전부)
       "'스마트 플레이스 정보'를 우선 정확하고 풍부하게 반영해주셔야 합니다"
       ① 최신 업체 정보 업데이트
       ② 업체정보 등록 가이드 참고 — 업체명·업종·전화번호·주소·홈페이지·
          찾아오는 길·가격·사진·영업시간·대표 키워드
       ③ 스마트플레이스 활용법 참고 (교육 영상 2건)
       → 요령이 아니라 빈칸 채우기다.

    ③d2 AI 브리핑 (24632 전문)
       "장소에 대한 정보를 한눈에 파악할 수 있도록 요약하여
        플레이스 검색 결과에 제공"
       ★ "네이버 이용자가 작성한 데이터를 바탕으로 제공되기 때문에
          내용을 임의로 수정할 수 없습니다"
       → 손님이 리뷰에 쓴 말이 요약돼 검색 결과에 걸리고, 사장님은 못 고친다.
         리뷰가 두 번 작동한다 — 유사도 매칭 + AI 브리핑 요약문.

       조건 — "음식점, 카페 등 일부 업종 및 리뷰가 많은 업체 대상"
             "리뷰수가 기준에 맞지 않을 경우 서비스가 제공되지 않습니다"
             ⚠️ 기준 숫자는 공개돼 있지 않다. 몇 개부터인지 모른다.
       자리 — "가게명으로 검색 시 나오는 플레이스 검색 결과 및 업체 상세 페이지 홈탭"
       끄기 — 스마트플레이스 관리 페이지(업체정보 > AI 정보), 1일 이내 반영
             (AI 브리핑 제공 업체에 한함). 고칠 수는 없고 끌 수만 있다.
       화면 라벨(예시 이미지에서 읽음, 본문 텍스트 아님)
             "AI 브리핑  실험 단계로 정확하지 않을 수 있어요."
             "사용자 리뷰를 바탕으로 주요 특징을 요약했습니다."

    ③e 어뷰징 판정 기준 4가지 (전문 확보)
       · 다수의 계정으로 접속, 불법 프로그램, 검색 광고 마케팅 업체나 앱 등을 통해
         허위 클릭을 과다하게 유발하는 경우
       · 허위 예약을 일으켜 예약·판매 건수를 증가시키거나, 일정 시차를 두고 취소 환불
       · 일정 기간 동안 예측 가능한 검색 알고리즘을 벗어난 비정상적인 검색 패턴이
         감지되거나 반복해서 발생한 경우
       · 그 외 어뷰징 행위 등으로 검색 품질을 저해하거나 특정 업체의 이익을 취한 경우
       ★ 1번에 "검색 광고 마케팅 업체나 앱" 이 이름으로 들어 있다.
       결과 — "어뷰징 행위에 대한 페널티 부여 및 제재 조치"
       ⚠️ "세부적이고 정밀한 어뷰징 필터 기준은 외부에 공개하지 않는" 다.
          대행사가 "안 걸린다" 고 말할 근거는 공개된 적이 없다.

    ④ 시술 사진(20426) — 전문 확보. 모니터링 기준 6가지.
       ★ 6번이 특히 중요하다. 네이버가 AI 이미지 기준을 명시했다.
         "AI를 활용한 얼굴 생성은 가능하지만, 매장에서 시술하지 않은 시술 사진일
          경우 등록 불가"
         · AI로 모델·마네킹 얼굴을 다른 사람으로 바꾼 것 → 등록 가능
         · AI로 시술하지 않은 헤어스타일을 생성하거나 타샵 이미지 활용 → 불가
       → NV-03(웹 콘텐츠 스팸사례)의 "특정 기술의 활용 여부만으로는 판단하지
         않습니다" 와 같은 원리다. AI 를 쓴 게 문제가 아니라 실제로 했느냐를 본다.
       그 밖에 확인된 사실 — 시술 사진은 300개까지. 삭제된 사진은 원상 복구 불가.
    ⑤ 어뷰징 — "각종 프로그램과 기술적인 도구들로 트래픽을 과도하게 유발" (스니펫)
