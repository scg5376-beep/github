  전문확인:
  - 파워링크 노출 순위는 어떻게 결정되나요 (faq/189)
  - 플레이스광고 과금 영역은 어떻게 되나요 (faq/400)
  부분확인: |
    ★ A 는 faq/189 · faq/400 둘이다. 나머지 광고 문서는 여전히 B(발췌만) 다.
    특히 '광고가 클릭되는 경우에만 과금' 과 '월정액제로 결제 유도' 는
    다른 페이지의 발췌문이라 아직 전문을 못 봤다.
    플레이스광고의 '순위' 를 무엇으로 정하는지도 아직 모른다. 과금만 확인했다.
  결과: |
    파워링크 순위 (faq/189 전문)

      "검색어와 사이트 콘텐츠의 연관성, 입찰가(자동입찰), 소재 품질 등의
       종합적인 결과를 바탕으로 광고 순위가 결정됩니다."

    ★ 대행사가 파워링크에 갖다 붙이는 '입찰가 × 품질지수' 공식이
      공식 문서와 어긋난다는 걸 원문으로 확인했다.
      파워링크 문서에는 '품질지수' 라는 말이 아예 없다.
      '품질지수' 는 쇼핑검색광고 문서에만 나온다. 상품마다 산정 방식이 다르다.

    노출 개수 (전에는 몰랐던 것)
      "순위가 높은 10개의 광고가 파워링크 영역에 노출됩니다."
      "검색 사용자가 많이 찾지 않는 일부 키워드의 광고는
       파워링크 영역에 최대 3개까지만 노출될 수도 있습니다."
    → 검색량이 적은 키워드는 광고 자리 자체가 3개로 줄어든다.
      경쟁은 덜하지만 자리도 적다.

    플레이스광고 과금 (faq/400 전문)

      과금되는 클릭 — 개별 플레이스 업체 페이지로 이동하는 클릭 및
        '전화' · '예약' · '저장하기' · '길찾기' 아이콘 ·
        '방문자 리뷰' · '플레이스 플러스(beta)' 등
      ★ 과금 안 되는 것 — "길찾기 출발 아이콘, 공유하기 아이콘"
        '길찾기' 아이콘은 과금인데 그 안의 '출발' 아이콘은 아니다. 헷갈리기 쉽다

      기기에 따라 과금 시점이 다르다
        목록 영역   목록의 광고를 클릭했을 때
        모바일      마커를 눌러 뜬 요약카드를 클릭했을 때 (마커 클릭만으론 과금 안 됨)
        PC 지도검색  ① 마커를 클릭했을 때 ② 마우스오버로 뜬 요약카드를 클릭했을 때
      → PC 에서는 지도 아이콘을 누르는 것만으로 과금된다. 모바일과 다르다
