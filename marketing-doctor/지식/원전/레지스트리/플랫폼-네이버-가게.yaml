  공식문서위치: 확인됨
  공식문서:
  - 이름: 플레이스 업체 검색 순위 알고리즘 안내
    url: https://help.naver.com/service/30026/contents/23472
  - 이름: 플레이스 업체 검색 순위를 높이는 방법 안내
    url: https://help.naver.com/service/30026/contents/23473
  - 이름: 플레이스 SEO 및 어뷰징 운영원칙
    url: https://smartplace.naver.com/help/policy?menu=abuse&tab=smartplace
  - 이름: 미용실 플레이스 시술사진 등록 기준 안내
    url: https://help.naver.com/service/30026/contents/20426
  - 이름: 플레이스 AI 브리핑 노출 안내
    url: https://help.naver.com/service/30026/contents/24632
  - 이름: 업체 신규등록 방법
    url: https://help.naver.com/service/30026/contents/20366
  결과: |
    ① 순위 요소 — 23472 전문에서 확인했다. 문장이 둘로 나뉘어 있다.

       앞 문장: "검색 질의에 대한 업체 유사도, 검색질의에 대한 카테고리와 업체의
                인기도, 거리, 정보의 충실성 등을 감안하여 결정합니다."
       뒷 문장: "실제 이용자의 경험을 반영한 방문 리뷰 텍스트와 사진 등의 다양한
                품질 요소와 플레이스에서 자체 수집하는 검색 데이터를 복합적이고
                종합적으로 검토하여 반영하고 있습니다."

       ★ '등' 뒤에 무엇이 있는지 이제 일부 안다 —
         방문 리뷰의 텍스트와 사진 · 플레이스 자체 수집 검색 데이터.
       ★ 여기서 말하는 '사진' 은 **방문 리뷰에 딸린 사진**이다.
         업체가 등록한 대표사진이라고 쓰여 있지 않다. 섞지 않는다.

    ② "노출 순서는 고정된 것이 아니며, 수시로 변경될 수 있습니다."
       → 순위가 안 오른다고 뭘 잘못했다고 단정할 수 없다는 뜻이다.

    ③ 두 문서가 같은 요소를 다르게 부른다 → 불일치.md
       23472  "업체 유사도"        23473  "검색어와 정보의 유사도"
       23472  "카테고리와 업체의 인기도"  23473  "업체와 카테고리 인기도"

    ④ 시술 사진(20426) — 전문 확보. 모니터링 기준 6가지.
       ★ 6번이 특히 중요하다. 네이버가 AI 이미지 기준을 명시했다.
         "AI를 활용한 얼굴 생성은 가능하지만, 매장에서 시술하지 않은 시술 사진일
          경우 등록 불가"
         · AI로 모델·마네킹 얼굴을 다른 사람으로 바꾼 것 → 등록 가능
         · AI로 시술하지 않은 헤어스타일을 생성하거나 타샵 이미지 활용 → 불가
       → NV-03(웹 콘텐츠 스팸사례)의 "특정 기술의 활용 여부만으로는 판단하지
         않습니다" 와 같은 원리다. AI 를 쓴 게 문제가 아니라 실제로 했느냐를 본다.
       그 밖에 확인된 사실 — 시술 사진은 300개까지. 삭제된 사진은 원상 복구 불가.
    ⑤ 어뷰징 — "각종 프로그램과 기술적인 도구들로 트래픽을 과도하게 유발" (스니펫)
  못한것: |
    23473 은 제목이 '순위를 높이는 방법' 인데 도입부만 받았다. 방법 부분을 못 봤다.
    어뷰징 판정 기준 문서 전문을 못 봤다.
  승급조건: 23473 본문을 열어 붙여 주시면 NV-05 전체가 A 가 된다.
