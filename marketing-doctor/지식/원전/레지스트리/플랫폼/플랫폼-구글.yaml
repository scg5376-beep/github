- id: GG-02
  이름: Google Search Essentials (검색 필수 요건) 와 Spam Policies (스팸 정책)
  저자: Google
  기관: Google Search Central (공식 문서)
  연도: Search Essentials 는 2022-10-11 에 Webmaster Guidelines 를 대체했다고 전해진다
  등급: B
  근거: 공식
  원문확인: false
  공식문서위치: 확인됨
  공식문서:
  - 이름: Google Search Essentials
    url: https://developers.google.com/search/docs/essentials
  - 이름: Spam Policies for Google Web Search
    url: https://developers.google.com/search/docs/essentials/spam-policies
  - 이름: March 2024 core update and new spam policies (공식 블로그)
    url: https://developers.google.com/search/blog/2024/03/core-update-spam-policies
  결과: |
    ⚠️ google.com 계열이 전부 차단돼 원문을 못 열었다.
    "구글 문서에 이렇게 적힌 것으로 전해진다" 로 쓴다. 큰따옴표를 쓰지 않는다.

    검색 필수 요건은 세 부분으로 돼 있다고 전해진다.
      기술 요건(Technical requirements)  구글이 페이지를 검색에 보여주려면 최소한
                                        필요한 것. 크롤러 접근이 막히면 색인되지 않는다
      스팸 정책(Spam policies)           순위가 내려가거나 아예 빠지게 만드는 행위
      핵심 권장사항(Key best practices)   도움이 되는·신뢰할 수 있는·사람을 위한 콘텐츠

    ★ 2024년 3월에 스팸 정책 세 가지가 새로 추가됐다고 전해진다.
      대량 콘텐츠 남용(scaled content abuse)
        검색 순위를 조작할 목적으로 이용자에게 도움이 되지 않는 페이지를 대량 생성하는 것.
        가치가 거의 없는 비독창적 콘텐츠를 대량으로 만드는 데 초점이 맞춰진 관행이며,
        ★ 만드는 방식과 무관하게 적용된다고 전해진다
          (영어 표현은 no matter how it's created 로 전해진다. 원문 대조 못 함.
           우리말 번역을 큰따옴표로 인용하지 않는다 — 확인한 문구가 아니다)
      만료 도메인 남용(expired domain abuse)
        만료된 도메인을 사서 과거 평판을 이용해 저품질 콘텐츠를 올리는 것
      사이트 평판 남용(site reputation abuse)
        기생 SEO(parasite SEO). 2024-05-05 부터 적용된다고 전해진다

    그 밖에 클로킹, 도어웨이 남용, 해킹된 콘텐츠, 숨긴 텍스트, 키워드 스터핑 등이
    스팸 정책에 포함된다고 전해진다.
  못한것: |
    각 항목의 원문 정의와 전체 목록을 확인하지 못했다.
    기술 요건의 세부(상태 코드 · robots · 색인 가능 형식)도 원문을 못 봤다.
  승급조건: 위 URL 을 열어 붙여 주시면 A. developers.google.com 차단.
  확인한곳:
  - https://developers.google.com/search/docs/essentials/spam-policies
  - https://developers.google.com/search/blog/2024/03/core-update-spam-policies

- id: GG-03
  이름: Google 비즈니스 프로필 정책 (Guidelines for representing your business on Google)
  저자: Google
  기관: Google Business Profile 고객센터
  등급: B
  근거: 공식
  원문확인: false
  공식문서위치: 확인됨
  공식문서:
  - 이름: 비즈니스 정보 표시 가이드라인
    url: https://support.google.com/business/answer/3038177
  - 이름: 금지 및 제한 콘텐츠
    url: https://support.google.com/business/answer/7400114
  - 이름: 비즈니스 프로필 정책 개요
    url: https://support.google.com/business/answer/13762416
  - 이름: 사진·동영상 정책 및 게시물 콘텐츠 정책
    url: https://support.google.com/business/answer/7213077
  - 이름: 정책 위반에 따른 비즈니스 프로필 제한
    url: https://support.google.com/business/answer/14114287
  결과: |
    ⚠️ support.google.com 이 차단돼 원문을 못 열었다. 전부 2차 경로다.

    · 정보는 정직하고 솔직해야 하며, 손님이 우리 가게를 이해하는 데 관련 있고
      쓸모 있는 내용에 집중해야 한다고 전해진다
    · 한 사업체당 프로필은 하나여야 한다. 여럿이면 지도·검색 표시에 문제가 생긴다
    · 제한 콘텐츠 — 주류 · 도박 · 담배 · 총기 · 건강 및 의료기기 · 규제 의약품 ·
      성인 서비스 · 금융 서비스 등이 포함된다고 전해진다
    · 업체와 무관하거나 명확한 연관이 없는 콘텐츠는 허용되지 않는다
    · 업체 설명에 링크는 어떤 형태도 허용되지 않는다고 전해진다
    · 위반 시 콘텐츠 표시 제한 · 순위 억제 · 프로필 정지가 가능하다고 전해진다
  못한것: |
    로컬 검색 순위 요소(관련성·거리·인지도)의 공식 문구를 확보하지 못했다.
    한국에 따로 적용되는 조건이 있는지 확인하지 못했다.
    정지 후 복구 절차와 소요 기간도 원문을 못 봤다.
  승급조건: 위 URL 을 열어 붙여 주시면 A. support.google.com 차단.
  확인한곳:
  - https://support.google.com/business/answer/3038177
  - https://support.google.com/business/answer/7400114
