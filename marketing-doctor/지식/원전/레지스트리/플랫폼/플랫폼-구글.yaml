버전: 1.0
갱신일: 2026-09-01

원전:
- id: GG-01
  이름: Creating Helpful, Reliable, People-First Content
  저자: Google
  기관: Google Search Central (공식 문서)
  등급: B
  근거: 공식
  원문확인: false
  공식문서:
  - url: https://developers.google.com/search/docs/fundamentals/creating-helpful-content
  공식문서위치: 확인됨
  못한것: 전문 열람 (developers.google.com 접근 차단). 자기점검 질문 전체 목록 미확보.
  승급조건: 공식문서 URL 을 열어 전문을 확인하면 A.
  오류복원: 2026-08-31 — MT-01 을 고칠 때 .replace() 가 같은 모양의 블록을 둘 다 바꿔 GG-01 이 A 로 잘못 올라가 있었다. 되돌렸다.

- id: GG-02
  이름: Google 웹 검색의 스팸 정책
  저자: Google
  기관: Google Search Central (공식 문서)
  등급: A
  근거: 공식
  원문확인: true
  원문보관: 구글/
  공식문서위치: 확인됨
  공식문서:
  - 이름: Google 웹 검색의 스팸 정책
    url: https://developers.google.com/search/docs/essentials/spam-policies
  - 이름: Google Search Essentials
    url: https://developers.google.com/search/docs/essentials
  전문확인:
  - 웹 검색의 스팸 정책 한국어판 전문 — 2026-09-02, 사장님이 열어 붙여 주심
  - 2024년 3월 핵심 업데이트 및 새로운 스팸 정책 (공식 블로그) 전문 — 같은 날
  미확인:
  - 사이트 인지도 정책의 "자세한 안내"(사람 검토 요소 · 조치 가능성 예시 셋 · EEA FAQ 넷).
    받았으나 동네 가게와 무관해 보관본에 담지 않았다
  - 영어 원문. 확보한 것은 한국어판이다
  - 공식 블로그 본문의 접힌 FAQ 넷 (AI 콘텐츠 인식 변화 · 자동 생성 콘텐츠 정책과의 차이 ·
    사용되는 순위 신호 · 쿠폰 영역). 제목만 있고 답변이 펼쳐지지 않은 채로 받았다
  결과: |
    ★ 이 창고가 틀리게 적어 뒀던 것 — 공식 명칭이 다르다
    · "대량 콘텐츠 남용(scaled content abuse)" → 한국어 공식 명칭은 확장된 콘텐츠 악용
    · "만료 도메인 남용" → 만료된 도메인 악용
    · "사이트 평판 남용 / 기생 SEO" → 사이트 인지도 정책
    · "키워드 스터핑" → 유인 키워드 반복
    · "도어웨이 남용" → 도어웨이 악용
    · 사이트 인지도 악용의 적용일 2024-05-05 는 스팸 정책 페이지에 없고 공식 블로그에 있다.
      한 번 "2차 자료의 말" 로 보고 뺐다가 블로그를 받아 되살렸다 —
      한 문서에 없다고 없는 게 아니다
    ★ 오래 못 쓰고 있던 문장의 공식 한국어판을 확보했다
    · 확장된 콘텐츠 악용은 "생성 방법에 관계없이" 가치 없고 독창적이지 않은 콘텐츠를
      대량으로 만드는 데 중점을 둔 관행이라고 정의한다
      → 그동안 영어 no matter how it's created 를 우리가 번역해 큰따옴표 없이 썼다.
        이제 공식 문구가 있으므로 그대로 인용한다
    · 예시 첫 줄이 "생성형 AI 도구 또는 기타 유사한 도구를 사용하여 사용자에 대한 가치
      창출 없이 많은 다량의 페이지 생성" 이다
    ★ 새로 확인한 것
    · 스팸 정의에 "생성형 AI 대답을 조작하려고 시도하는 것" 이 들어간다
    · 링크는 rel="nofollow" 또는 rel="sponsored" 를 붙이면 사고팔아도 위반이 아니다
    · 사용자 생성 스팸 — 댓글·게시판 스팸. 사이트 소유자가 모르는 경우가 많다고 명시
    · 사이트 인지도 정책은 EEA 안과 밖의 처리가 다르다 (밖은 직접 조치, 안은 별도 분류)
    · 숨기기·표시 UI 중 위반이 아닌 것 넷을 명시 — 아코디언·탭 / 슬라이드쇼 /
      상호작용 시 나오는 도움말 / 스크린 리더 전용 텍스트
    · 순위 내리기·삭제로 이어지는 기타 관행 — 법적 삭제 · 개인 정보 삭제 · 정책 회피 · 사기
    ★ 공식 블로그에서 추가로 확인한 것
    · 확장된 콘텐츠 악용은 "콘텐츠가 자동화, 사람의 노력 또는 사람과 자동화 프로세스의 조합을
      통해 제작되었는지 여부와 관계없이" 조치할 수 있게 한 정책이다 — 가장 명확한 문장
    · 핵심 업데이트 쪽 — "콘텐츠의 유용성을 파악할 때 이제 더 이상 하나의 신호나 시스템만이
      사용되지는 않습니다". 유용한 콘텐츠 시스템 하나를 붙잡을 일이 아니다
    · 만료된 도메인 — "사용자 중심의 서비스를 제공하는 새로운 원본 사이트라면 기존 도메인
      이름을 사용해도 됩니다". 중고 도메인 자체가 금지가 아니다
    · 네이티브 광고·애드버토리얼은 "Google 검색에서 차단되지 않아도 됩니다"
    · 직접 조치를 받으면 Search Console 로 알려 주고 재검토를 신청할 수 있다
  승급조건: 완료. 접힌 FAQ 넷과 사이트 인지도 자세한 안내는 별도.
- id: GG-03
  이름: Google 비즈니스 프로필 정책 (Guidelines for representing your business on Google)
  저자: Google
  기관: Google Business Profile 고객센터
  등급: B
  근거: 공식
  원문확인: false
  공식문서위치: 확인됨
  공식문서:
  - 이름: 비즈니스 정보 표시 가이드라인
    url: https://support.google.com/business/answer/3038177
  - 이름: 금지 및 제한 콘텐츠
    url: https://support.google.com/business/answer/7400114
  - 이름: 비즈니스 프로필 정책 개요
    url: https://support.google.com/business/answer/13762416
  - 이름: 사진·동영상 정책 및 게시물 콘텐츠 정책
    url: https://support.google.com/business/answer/7213077
  - 이름: 정책 위반에 따른 비즈니스 프로필 제한
    url: https://support.google.com/business/answer/14114287
  결과: |
    ⚠️ support.google.com 이 차단돼 원문을 못 열었다. 전부 2차 경로다.

    · 정보는 정직하고 솔직해야 하며, 손님이 우리 가게를 이해하는 데 관련 있고
      쓸모 있는 내용에 집중해야 한다고 전해진다
    · 한 사업체당 프로필은 하나여야 한다. 여럿이면 지도·검색 표시에 문제가 생긴다
    · 제한 콘텐츠 — 주류 · 도박 · 담배 · 총기 · 건강 및 의료기기 · 규제 의약품 ·
      성인 서비스 · 금융 서비스 등이 포함된다고 전해진다
    · 업체와 무관하거나 명확한 연관이 없는 콘텐츠는 허용되지 않는다
    · 업체 설명에 링크는 어떤 형태도 허용되지 않는다고 전해진다
    · 위반 시 콘텐츠 표시 제한 · 순위 억제 · 프로필 정지가 가능하다고 전해진다
  못한것: |
    로컬 검색 순위 요소(관련성·거리·인지도)의 공식 문구를 확보하지 못했다.
    한국에 따로 적용되는 조건이 있는지 확인하지 못했다.
    정지 후 복구 절차와 소요 기간도 원문을 못 봤다.
  승급조건: 위 URL 을 열어 붙여 주시면 A. support.google.com 차단.
  확인한곳:
  - https://support.google.com/business/answer/3038177
  - https://support.google.com/business/answer/7400114
