  전문확인:
  - 정산관리 수수료의 종류 페이지 전문 — 2026-09-02, 사장님이 열어 붙여 주심.
    Npay 수수료 등급표(2022-01-31~2025-09-30 / 2025-10-01~), 네이버쇼핑 판매수수료 네 종,
    버티컬·윈도·솔루션 사용료, 국세청 등급 산정 기준, 계산 예시까지 들어 있다
  미확인:
  - 건별 정산내역 조회방법 — 화면 캡처로만 봤다. 글자를 옮길 수 없어 인용하지 않는다.
    정산기준일·정산예정일 취지는 보관본 아래에 메모로만 남겼다
  - 가입·사업자 전환·이용확인증 FAQ 본문 (여전히 발췌만)
  결과: |
    ★ 전문으로 확인한 것 — 수수료는 둘이고 붙는 자리가 다르다
    · Npay 수수료는 상품금액·초기배송비·반품/교환배송비 전부에 붙는다.
      네이버쇼핑 판매수수료는 상품금액에만 붙고 배송비에는 안 붙는다
    · 수수료는 정산 시 자동 차감. 상품금액 수수료는 결제가 기준
      (판매가 10,000 · 즉시할인 1,000 이면 9,000 에 부과)
    · Npay 수수료 = 결제수수료 + 주문관리수수료(0.99%, VAT포함). 국세청 매출 등급별 차등.
      2025-10-01 결제건부터 영세 1.947 / 중소1 2.563 / 중소2 2.728 / 중소3 3.003 / 일반 3.630 (VAT포함)
      그 전(2022-01-31~2025-09-30)은 1.980 / 2.585 / 2.750 / 3.025 / 3.630
    · 등급은 국세청 신고 총매출(자사몰·Npay 가맹점 포함) 기준. 신고 내역이 없으면 직전 반기
      오픈마켓·PG 매출로 산정. 입점일 당일은 등급과 무관하게 '일반'으로 노출
    · 국세청 매출 등급은 연 2회(2월 14일, 8월 14일) 업데이트
    · 네이버쇼핑 판매수수료 네 종 (정산 시 VAT 포함) —
      스마트스토어 판매자마케팅 1% / 브랜드스토어 판매자마케팅 2% /
      스마트스토어 판매수수료 3% / 브랜드스토어 판매수수료 4%
      주문건이 생기면 이 넷 중 하나는 무조건 발생한다
    ★ 이 창고 주제와 직결되는 문장
    · 판매자가 직접 네이버 내부 또는 외부에서 광고·홍보를 통해 유입한 고객이 구매하면
      판매자 마케팅 수수료가 적용되어 낮은 수수료가 과금된다
      → 문서의 계산 예시로 3% 300원이 1% 100원이 된다. 손님을 직접 데려오는 일의 값어치가
        수수료에서도 숫자로 나타난다
    · 신규 창업 사업자가 '일반' 으로 시작했다가 반기 신고로 영세·중소에 해당하면
      이전 반기 카드 수수료를 소급 환급한다 (매년 3월·9월)
  승급조건: 완료. 가입·전환 FAQ 와 건별 정산내역은 아직.
