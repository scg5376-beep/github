  - 로켓그로스 물류비. 표에 VAT 포함 여부가 적혀 있지 않다
  결과: |
    ★ 전문으로 확인한 것
    · 쿠팡이 스스로 밝힌 세 가지 — 할인된 가격에 수수료를 부과한다 /
      포털사이트 노출을 위한 연동 비용을 추가로 부과하지 않는다 /
      결제수수료를 이중으로 부과하지 않는다
      ⚠️ "국내 타 오픈마켓 대비 최저" 는 쿠팡의 주장이다. 검증하지 않았다
    · 대분류 기본 수수료 — 가전디지털 7.8 / 가구·홈인테리어 10.8 / 도서 10.8 / 음반 10.8 /
      문구·사무용품 10.8 / 출산·유아 10 / 스포츠·레저 10.8 / 뷰티 9.6 / 생활용품 7.8 /
      식품 10.6 / 완구·취미 10.8 / 자동차용품 10 / 주방용품 10.8 / 패션 10.5 / 반려·애완 10.8
    · 표에서 가장 낮은 것은 순금·골드바·돌반지 4%, 가장 높은 것은 면·라면 10.9%
    · 같은 대분류 안에서도 소분류마다 다르다 (예: 생활용품 기본 7.8 인데 공구·철물류 10.8)
    · ★ 안내사항 — 상품이 등록된 후에는 카테고리를 변경할 수 없다.
      부적절하면 적정 카테고리로 수정될 수 있고 그 카테고리의 수수료율이 적용된다.
      분류의 의무와 책임, 손해와 법적 책임은 판매자에게 있다
  승급조건: 수수료 표는 완료. FAQ 본문과 정산 주기는 아직.
