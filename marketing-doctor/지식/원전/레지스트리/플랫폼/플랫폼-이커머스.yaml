  결과: |
    발췌로 확인한 것 (원문 대조 못 함)
    · 수수료는 2가지 — Npay 수수료(결제·주문관리·배송추적·안심번호 등 포함, 결제금액 기준) 와
      네이버쇼핑 판매수수료(쇼핑 검색을 거쳐 들어온 주문에 붙는다). 2025-06-02 결제건부터 약관·
      수수료 체계 변경. 부가세 포함 수수료율로 정산. 등급은 정산관리 > 정산내역에서 확인
    · 개인판매자로 가입 후 사업자번호를 얻으면 사업자 판매자로 전환 가능
    · 전환 시 간이사업자는 통신판매업 신고번호 입력 미필수, 개인/법인 사업자는 필수
    · 지속적으로 판매하면 사업자등록을 해야 하며 없이 팔면 불이익
    · 통신판매업 신고용 구매안전서비스 이용확인증은 PC 에서만 출력
    ⚠️ 수수료 숫자(매출 규모별 Npay 등급 등)는 2차 자료마다 달라 옮기지 않는다.
  못한것: 수수료율 표 원문. 개인판매자 가입 요건(연령 등). 정산 주기.
  승급조건: 위 URL 을 열어 붙여 주시면 A. 수수료는 그날 기준.
