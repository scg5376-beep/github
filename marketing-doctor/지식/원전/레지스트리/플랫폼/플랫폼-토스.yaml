- id: TS-01
  이름: 토스 머니 알림 광고 상품 소개서 (2024.03)
  저자: CV3 광고센터 (토스 광고 판매 대행사)
  기관: 대행사 자체 발행
  등급: B
  근거: 공식
  원문확인: false
  확인자: Claude (재배포 PDF 를 내려받아 그림으로 만들어 읽음)
  확인일: 2026-09-04
  원문보관: 토스/TS-01-머니알림-소개서-2024-03.md
  판본: 2024.03 — 두 해 반 전 자료다
  확보경로: labangba-public.s3.ap-northeast-2.amazonaws.com/datalab/ (제3자 재배포본)
  왜B인가: |
    문서 자체는 전문(7장)을 확보했다. 그래서 "이 문서에 이렇게 적혀 있다" 는 확실하다.
    하지만 이 창고가 A 라고 부르는 것은 '그 주체의 공식 문서' 다.
    이건 토스가 아니라 토스 광고를 파는 회사가 만든 판매 자료다.
    그리고 문서 안 숫자(오픈율 30% 등)의 근거는 문서 어디에도 없다.
  못한것: |
    토스 공식 문서를 한 장도 못 봤다 — tossads.toss.im · toss.im · tossbusiness.com ·
    toss-ads.gitbook.io · shopping-docs.toss.im · tossadspolicy.oopy.io 전부 차단(000).
    PDF 가 전부 이미지라 글자를 못 뽑았다. 눈으로 읽어 옮겼고 자동 대조를 못 했다.
    이 단가가 2026년에도 유효한지 확인하지 못했다. 문서 스스로 변경될 수 있다고 적었다.
  승급조건: 토스애즈 공식 상품 안내 전문을 확보하면 A.
  숫자사용: 글에 쓰지 않는다. 우리가 예산 자릿수를 가늠하는 데만 쓴다.

