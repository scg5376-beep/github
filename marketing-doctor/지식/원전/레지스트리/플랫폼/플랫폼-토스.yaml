반증시도:
  했나: true
  무엇을: |
    "토스 광고 효율 안 나온다 / 실패 / 리워드 어뷰징" 방향으로 찾아봤다.
  결과: |
    토스가 낸 성공 사례와 대행사 성공 사례는 여럿 나왔다.
    실패 사례를 정리한 신뢰할 만한 자료는 못 찾았다. **없다는 뜻이 아니라 못 찾았다는 뜻이다.**
    리워드로 받는 10~20원이 참여 동기가 되는 구조라, 클릭이 곧 관심이라고 볼 수 없다는
    의심은 남는다. 이건 우리가 붙인 해석이고 근거가 없다.
