    url: https://searchadvisor.naver.com/guide/faq-sublink
  - 이름: 사이트 최적화 리포트
    url: https://searchadvisor.naver.com/guide/report-seo
  - 이름: 진단하기
    url: https://searchadvisor.naver.com/diagnose
  - 이름: (PDF) 네이버 사이트 검색 BASIC
    url: https://searchadvisor.naver.com/doc/wmt_guide_ps_websearch.pdf
  - 이름: (PDF) 사이트 품질향상을 위한 웹마스터도구 활용 가이드
    url: https://searchadvisor.naver.com/doc/wmt_guide_ps_quality.pdf
  결과: |
    발췌로 확인한 것 (원문 대조 못 함 — 큰따옴표 안 씀)
    · 네이버 웹 검색은 로봇이 자동 수집한 정보를 반영하므로 검색 등록 절차는 존재하지 않는다
    · 웹마스터도구는 사이트의 검색수집·색인반영 현황과 진단 리포트를 제공한다
    · robots.txt 는 수집 허용·제한의 국제 권고안. IETF 가 2022-09 표준화 문서 발행. 루트에 둔다
    · 여러 hostname 을 쓴다고 노출 가능성이 높아지지 않는다. 똑같은 내용은 중복 판정
    · canonical 로 대표 URL 지정. 자바스크립트 redirect 는 로봇이 이해하기 어려우니 자제
    · 메인 페이지 title 은 사이트 성격을 표현하는 브랜드명(상호명·서비스명 등)으로
    · RSS·사이트맵은 콘텐츠 피드로 간주해 주기적으로 재방문
    · 웹페이지 수집요청은 사이트별로 제한된 범위. IndexNow 로 갱신 알림 가능
    · 검색 제외는 법률·저작권 위반 같은 정책위반의 경우에만. 정상 접속 사이트는 임의 삭제 불가
    · site: 검색에 안 보이면 아직 수집 못 했거나 수집·색인 불가능한 문서일 가능성
  못한것: |
    각 페이지 전문. 수집요청 횟수 상한. 콘텐츠 권장 사항의 원칙 목록 전체. 스팸사례는
    NV-03 원문(원문/네이버/)과 같은 문서로 보이나 URL 이 달라 동일성 확인 못 함.
  승급조건: 위 URL 을 열어 붙여 주시면 A. 특히 seo-basic-intro · faq-start-register · content-basic.

- id: NS-02
  이름: 서치어드바이저 고객센터 — 소유확인 · 등록 가능 사이트
  저자: 네이버
  기관: 네이버 고객센터 (서비스 30010)
  등급: B
  근거: 공식
  원문확인: false
  공식문서위치: 확인됨
  공식문서:
  - 이름: 소유확인 소개
    url: https://help.naver.com/service/30010/contents/17591?osType=PC
  - 이름: 연동(추가) 가능 사이트 안내
    url: https://help.naver.com/service/30010/contents/17587?osType=PC
  - 이름: 소유확인 진행이 어려운 경우
    url: https://help.naver.com/service/30010/contents/17598?osType=PC
  - 이름: 사이트 관련 앱·채널 등록 안내
    url: https://help.naver.com/service/30010/contents/17590?osType=PC
  결과: |
    · 소유확인은 본인이 직접 소유한 사이트임을 증명하는 과정. 수집·삭제 요청이 검색 결과에
      영향을 주기 때문에 필요하다
    · 누구나 접근 가능한 사이트면 등록 가능. 아이디 하나당 100개까지
    · 소유확인 전 프로토콜(http/https)을 정확히 선택해야 한다
    · 웹마스터도구는 채널·앱 추가 기능이 없다. 사이트 추가 후 소유확인 → 연관 채널 값 지정
    · 소유확인 방법은 HTML 메타 태그 또는 HTML 파일 업로드 (2차 자료 velog 가 seo-basic-intro 를 인용)
  못한것: 각 페이지 전문
  승급조건: 위 URL 을 열어 붙여 주시면 A.
