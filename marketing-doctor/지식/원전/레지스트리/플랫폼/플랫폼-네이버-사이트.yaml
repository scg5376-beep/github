    최적화 방법 10가지가 전부 들어 있다
  미확인:
  - 같은 가이드의 나머지 장 — robots.txt 설정하기 · HTML 마크업 가이드 · RSS 및 사이트맵 제출 ·
    검색로봇 확인 방법 · 자바스크립트 검색 최적화 · 콘텐츠 작성시 권장 사항 · 웹 콘텐츠 스팸사례
  - 사이트 등록 및 소유확인 FAQ · 웹 검색 미노출 FAQ 본문
  결과: |
    ★ 전문으로 확인한 것 (10가지 최적화 방법)
    · 사이트 등록은 호스트 단위만 지원. www.mysite.com·blog.mysite.com 은 되고
      www.mysite.com/myid 는 안 된다
    · 소유 확인은 HTML meta 태그 또는 HTML 파일 업로드
    · 소유 확인이 안 되는 다섯 경우 — 방화벽 차단 / 메인 페이지가 자바스크립트·meta refresh 로
      redirect / frame 태그 내부에 확인 태그 / 업로드용 원본 HTML 파일 손상 / IE 11 미만
    · robots.txt 예시 — User-agent: Yeti + Allow: / (또는 User-agent: *)
    · 검색로봇 이름은 Yeti. IP 기반 차단을 하지 말라고 명시 (IP 대역이 바뀐다)
    · 동일 콘텐츠로 여러 사이트를 개설하면 검색 노출에 불이익. 모든 페이지 제목을
      동일하게 표현하지 말라
    · 사이트맵은 XML, RSS 에는 최신글 본문 전체를 담으라
    · 검색 반영은 검색로봇 방문 뒤 최대 1주일 이내. site: 질의로 확인
    · 메인 미노출 원인 — robots.txt·방화벽 / meta noindex / 제목·설명 정책 위반 / frame 태그
      (noindex 라도 공공기관·교육기관 등 공공재 성격 사이트와 선호도 높은 사이트는 예외가 있다)
    · 콘텐츠 미반영 원인 — noindex / 콘텐츠 전체가 자바스크립트 로딩 / frame / 자바스크립트 redirect
    · 문서 수가 적은 원인 — 사이트맵·RSS 의 상대 경로와 호스트 불일치 / nofollow /
      자바스크립트로만 만든 링크
  승급조건: 위 URL 을 열어 붙여 주시면 A. 특히 seo-basic-intro · faq-start-register · content-basic.

- id: NS-02
  이름: 서치어드바이저 고객센터 — 소유확인 · 등록 가능 사이트
  저자: 네이버
  기관: 네이버 고객센터 (서비스 30010)
