  못한것: |
    도달(Reach)·노출(Impressions)·CTR(클릭률)·CPC(클릭당 비용)·구매 ROAS 다섯은
    독립된 공식 도움말 문서를 못 찾았다(검색으로 안 걸림). Meta 광고 용어집
    페이지는 영문 알파벳 구간별 탭(0-B | C | D-H | I-K | L-N | O | P-T | U-V | W-Z)으로
    나뉜 자바스크립트 위젯인데, 받기 도구는 클릭을 못 해 기본값인 '0-B' 탭 내용만
    받았다. 저 다섯 용어의 정의는 이번에 못 받았다 — "못 받음" 으로 둔다.
    광고 가이드의 노출 위치별 이미지·동영상 사양도 '노출 위치/목표/형식'을
    바꿔 고르는 위젯이라 기본값(Facebook 피드 + 인지도 + 이미지)만 받았다.
    스토리·릴스 사양, 동영상 사양, 글자 수 상한 전체 표는 못 받았다.
  승급조건: |
    위 다섯 지표의 개별 도움말 URL을 찾거나, 탭을 클릭할 수 있는 받기 도구로
    용어집 전체 탭을 받으면 승급. 광고 가이드도 노출 위치 선택기를 조작할 수
    있는 도구로 다시 받으면 스토리·릴스·동영상 사양까지 승급.
