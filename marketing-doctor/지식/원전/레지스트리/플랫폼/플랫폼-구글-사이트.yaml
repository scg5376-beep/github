  결과: |
    모바일 사이트 3.7~4.5천 개, 2015-03~2016-05 데이터. 3초 넘게 걸리면 방문의 53% 가 이탈.
    ⚠️ 2015~16년 네트워크 조건. 10년 된 숫자다. 연도를 붙여야 쓸 수 있다.
  못한것: 원 보고서
