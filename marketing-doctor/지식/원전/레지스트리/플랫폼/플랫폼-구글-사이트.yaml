- id: GS-01
  이름: Google 검색 기술 요구사항
  저자: Google
  기관: Google Search Central
  등급: A
  근거: 공식
  원문확인: true
  원문보관: 구글/
  공식문서위치: 확인됨
  공식문서:
  - url: https://developers.google.com/search/docs/essentials/technical
  전문확인:
  - 한국어판 전문 — 2026-09-02, 사장님이 열어 붙여 주심. ★ 이 창고의 첫 구글 원문이다
  미확인:
  - 지원하는 파일 형식 목록 (본문이 링크로만 가리킨다)
  - 색인 생성을 차단하는 "여러 메커니즘" 의 목록
  결과: |
    ★ 원문으로 확인한 것
    · 검색결과에 페이지가 표시되게 하는 데에는 비용이 들지 않는다고 문서 첫 줄에 적었다.
      "누가 뭐라고 하든" 이라는 표현까지 붙어 있다
    · 최소 요구사항 셋 — Googlebot 이 차단되지 않음 / HTTP 200 으로 작동함 /
      색인 생성 가능한 콘텐츠가 있음
    · 요구사항을 충족한다고 해서 색인이 생성되는 것은 아니며 보장도 없다
    · 색인 생성 가능 콘텐츠 = 지원하는 파일 형식의 텍스트 + 스팸 정책 위반 아님
    · ★ robots.txt 로 Googlebot 을 차단하면 크롤링은 막히지만 URL 이 검색결과에
      계속 표시될 수 있다. 색인을 막으려면 noindex 를 쓰고 크롤링은 허용해야 한다
      → 흔한 오해가 정면으로 부정된 자리다
    · 비공개 페이지(로그인해야 보이는 경우)는 크롤링되지 않는다
    · Search Console 의 페이지 색인 생성 보고서와 크롤링 통계 보고서를 둘 다 보라고 한다.
      보고서마다 URL 정보가 다를 수 있다고 명시했다
  승급조건: 완료. 파일 형식 목록은 별도.
