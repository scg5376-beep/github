- id: GS-06
  이름: 페이지 경험 · Core Web Vitals 와 검색 결과
  저자: Google
  기관: Google Search Central
  연도: 2021 발행 · 2023-04 갱신
  등급: B
  근거: 공식
  원문확인: false
  공식문서위치: 확인됨
  공식문서:
  - url: https://developers.google.com/search/docs/appearance/page-experience
  - url: https://developers.google.com/search/docs/appearance/core-web-vitals
  결과: |
    Core Web Vitals 는 순위 시스템이 사용한다. 단일 신호는 없다. 리포트 점수가 좋다고 상위
    노출이 보장되지 않는다. CWV 외의 페이지 경험 요소는 순위를 직접 올리지 않는다고 전해진다.
    2020-05-28 발표 때는 관련성이 비슷할 때 가르는 요소로 설명됐고, 이후 John Mueller 가
    타이브레이커 이상이지만 관련성을 대체하지는 않는다고 말한 것으로 전해진다.
  못한것: 원문
  승급조건: 위 URL 을 열어 붙여 주시면 A.

- id: GS-07
  이름: Web Vitals — 지표 정의와 기준값
  저자: Google (web.dev)
  등급: B
  근거: 공식
  원문확인: false
  공식문서위치: 확인됨
  공식문서:
  - url: https://web.dev/articles/vitals
  - 이름: 기준값을 어떻게 정했나
    url: https://web.dev/articles/defining-core-web-vitals-thresholds
  결과: |
    LCP(로딩) 2.5초 이하 · INP(반응) 200ms 이하 · CLS(흔들림) 0.1 이하가 좋음. 실제 방문의
    75번째 백분위로 판정 — 방문 넷 중 셋이 그 수준 이상. CrUX 28일 이동 데이터로 전해진다.
  못한것: 원문
  승급조건: 위 URL 을 열어 붙여 주시면 A.

- id: GS-08
  이름: Milliseconds Make Millions
  저자: Deloitte · 55 (Google 의뢰)
  연도: 2020
  등급: B
  근거: 실증
  원문확인: false
  공식문서위치: 확인됨
  공식문서:
  - url: https://web.dev/case-studies/milliseconds-make-millions
  결과: |
    유럽·미국 브랜드 사이트 37개, 세션 3,000만 건. 모바일 속도 0.1초 개선이 리테일 전환율
    8.4% 상승·평균 주문액 9.2% 상승과 연관. ⚠️ 구글 의뢰 조사이고 상관관계다.
  못한것: 원 보고서 PDF. 측정 지표 정의.
  승급조건: 보고서를 열어 붙여 주시면 A.
  확인한곳:
  - https://www.thedrum.com/opinion/milliseconds-make-millions-report-finds-faster-site-speed-increases-revenue-brands

- id: GS-09
  이름: The Need for Mobile Speed
  저자: Google (DoubleClick)
  연도: 2016-09
  등급: B
  근거: 실증
