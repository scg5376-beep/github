- id: GS-01
  이름: Google Search Technical Requirements (검색 기술 요건)
  저자: Google
  기관: Google Search Central
  등급: B
  근거: 공식
  원문확인: false
  공식문서위치: 확인됨
  공식문서:
  - url: https://developers.google.com/search/docs/essentials/technical
  결과: |
    색인 자격의 최소 요건 셋 — Googlebot 이 차단되지 않을 것 · 페이지가 작동할 것(HTTP 200) ·
    색인 가능한 콘텐츠(지원 파일 형식, 스팸 정책 위반 아님). 요건을 채워도 색인이 보장되지는 않는다.
  못한것: 원문
  승급조건: 위 URL 을 열어 붙여 주시면 A.

- id: GS-02
  이름: SEO Starter Guide (검색엔진 최적화 기본 가이드)
  저자: Google
  기관: Google Search Central
  등급: B
  근거: 공식
  원문확인: false
  공식문서위치: 확인됨
  공식문서:
  - url: https://developers.google.com/search/docs/fundamentals/seo-starter-guide
  결과: |
    제목 링크는 title 요소와 페이지 제목들로 만들어진다. 검색결과에서 눈에 띄는 것은 제목 링크와
    스니펫. 메타 키워드 태그는 순위에 안 쓴다(2009 발표)고 2차 자료가 일치.
  못한것: 원문. "집중하지 말 것" 절의 전체 목록.
  승급조건: 위 URL 을 열어 붙여 주시면 A.

- id: GS-03
  이름: Search Console — 사이트 소유권 확인 · URL 검사
  저자: Google
  기관: Search Console 고객센터
  등급: B
  근거: 공식
  원문확인: false
  공식문서위치: 확인됨
  공식문서:
  - 이름: Verify your site ownership
    url: https://support.google.com/webmasters/answer/9008080
  - 이름: URL Inspection tool
    url: https://support.google.com/webmasters/answer/9012289
  결과: |
    소유권 확인 방법 다섯 — HTML 파일 업로드 · HTML 메타 태그 · DNS 레코드 · Google Analytics ·
    Google Tag Manager. URL 검사에서 색인 생성 요청 가능. 요청 횟수에 일일 한도가 있으나
    구글은 정확한 수를 공개하지 않는다(2차 자료 10~12건은 이용자 보고).
  못한것: 원문
  승급조건: 위 URL 을 열어 붙여 주시면 A.

