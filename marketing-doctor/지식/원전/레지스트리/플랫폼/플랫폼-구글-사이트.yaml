- id: GS-06
  이름: 페이지 경험 · Core Web Vitals 와 검색 결과
  저자: Google
  기관: Google Search Central
  연도: 2021 발행 · 2023-04 갱신
  등급: B
  근거: 공식
  원문확인: false
  공식문서위치: 확인됨
  공식문서:
  - url: https://developers.google.com/search/docs/appearance/page-experience
  - url: https://developers.google.com/search/docs/appearance/core-web-vitals
  결과: |
    Core Web Vitals 는 순위 시스템이 사용한다. 단일 신호는 없다. 리포트 점수가 좋다고 상위
    노출이 보장되지 않는다. CWV 외의 페이지 경험 요소는 순위를 직접 올리지 않는다고 전해진다.
    2020-05-28 발표 때는 관련성이 비슷할 때 가르는 요소로 설명됐고, 이후 John Mueller 가
    타이브레이커 이상이지만 관련성을 대체하지는 않는다고 말한 것으로 전해진다.
  못한것: 원문
  승급조건: 위 URL 을 열어 붙여 주시면 A.

- id: GS-07
  이름: Web Vitals (web.dev)
  저자: Philip Walton
  기관: Google · web.dev
  연도: 게시 2020-05-04 · 최종 업데이트 2024-10-31
  등급: A
  근거: 공식
  원문확인: true
  원문보관: 구글/
  공식문서위치: 확인됨
  공식문서:
  - url: https://web.dev/articles/vitals
  - 이름: 기준값을 어떻게 정했나
    url: https://web.dev/articles/defining-core-web-vitals-thresholds
  전문확인:
  - 한국어판 전문 — 2026-09-02, 사장님이 열어 붙여 주심
  미확인:
  - 영어 원문. 확보한 것은 한국어판이다
  - 기준값 산정 방법(defining-core-web-vitals-thresholds)은 링크로만 가리킨다
  - CrUX 의 집계 기간(28일 이라는 말이 2차 자료에 있다)은 이 문서에 없다 → 여전히 B
  주의: |
    ★ 한국어판은 기계 번역이다. 페이지에 "AI 번역에는 오류가 있을 수 있습니다" 라고 적혀 있고,
    실제로 Core Web Vitals 가 "핵심 성능 보고서" 로 옮겨진 곳이 여럿 있다.
    인용할 때 한국어판(기계 번역)임을 밝힌다. 숫자와 기준은 그대로 쓸 수 있다.
  결과: |
    ★ 원문으로 확인한 것
    · LCP 는 로드 성능 — 페이지 로드가 시작된 후 2.5초 이내
    · INP 는 상호작용성 — 200밀리초 이하
    · CLS 는 시각적 안정성 — 0.1 이하
    · 모바일과 데스크톱을 기기별로 구분해 페이지 로드 횟수의 75번째 백분위수로 본다
    · 세 측정항목 모두 75번째 백분위 목표를 충족해야 통과로 간주한다
    · 수명 주기 — 실험용 → 대기 중 → 안정. LCP·CLS·INP 는 셋 다 안정 단계다
    · 대기 중 단계는 최소 6개월 유지. 안정 측정항목은 1년에 한 번 이상 바뀌지 않는다
    · ★ 안정적이라고 영구적인 것은 아니다. 2024년에 INP 가 FID 를 대체했다
    · Lighthouse 는 INP 를 측정할 수 없다(사용자 입력이 없으므로). TBT 가 프록시다
    · 실험실 측정은 현장 측정을 대체할 수 없다고 못 박는다
    · TTFB·FCP 는 LCP 문제를 진단하는 보조 측정항목. TBT 는 필드에서 측정할 수 없어
      Core Web Vitals 에 들어가지 않는다
  승급조건: 완료. 기준값 산정 방법 문서는 별도.
