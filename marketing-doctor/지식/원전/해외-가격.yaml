원전:
- id: PR-01
  이름: 'Effects of $9 Price Endings on Retail Sales: Evidence from Field Experiments'
  저자: Eric Anderson, Duncan Simester
  기관: Quantitative Marketing and Economics
  연도: 2003
  등급: B
  근거: 실증
  원문확인: false
  설계: 실제 소매점 현장실험 3건 (설문이 아니라 실제 판매)
  결과: '세 실험 모두에서 9로 끝나는 가격이 수요를 늘렸다.

    효과는 신상품에서 더 강했다 — 예전부터 팔던 물건보다.

    '
  확인한곳:
  - https://www.researchgate.net/publication/225849046_Effects_of_9_Price_Endings_on_Retail_Sales_Evidence_from_Field_Experiments
- id: PR-02
  이름: 'Penny Wise and Pound Foolish: The Left-Digit Effect in Price Cognition'
  저자: Manoj Thomas, Vicki Morwitz
  기관: Journal of Consumer Research
  연도: 2005
  등급: B
  근거: 실증
  원문확인: false
  결과: '실험 5건. 9로 끝나는 가격이 더 싸게 느껴지는 것은

    **맨 왼쪽 자리가 바뀔 때만**이다 ($2.99 vs $3.00).

    앞자리가 같으면 효과가 없다.

    '
  중요: PR-01 의 '9를 붙이면 된다' 를 '앞자리가 바뀔 때만' 으로 좁힌 연구다.
  확인한곳:
  - https://www.semanticscholar.org/paper/c50c0263cb75eb74d970d7415b384e89608ff422
- id: PR-03
  이름: 'Never too rich to care about prices: Effects of price endings on customer perceptions of luxury'
  저자: Annalisa Fraccaro, Sandrine Macé
  연도: 2020
  등급: B
  근거: 실증
  원문확인: false
  역할: PR-01·02 의 조건을 좁히는 반증
  결과: '명품·고급 영역에서는 9로 끝나는 가격이 역효과일 수 있다.

    저품질·기만적 수법으로 인식되는 경향.

    '
  확인한곳:
  - https://journals.sagepub.com/doi/10.1177/2051570720908036
- id: FR-01
  이름: 'Zero as a Special Price: The True Value of Free Products'
  저자: Kristina Shampanier, Nina Mazar, Dan Ariely
  기관: Marketing Science 26(6), 742-757
  연도: 2007
  등급: B
  근거: 실증
  원문확인: false
  S후보: true
  설계: "초콜릿 두 개를 놓고 고르게 했다.\n  허쉬 키세스 1센트  vs  린트 트러플 14센트  → 다수가 트러플을 골랐다\n둘 다 1센트씩 내렸다 (실질 가격차는 그대로).\n\
    \  허쉬 0센트(공짜)   vs  린트 13센트        → 다수가 허쉬로 갈아탔다\n"
  결과: '가격을 0으로 내리는 것은, 같은 크기의 (양수 구간) 가격 인하보다

    비교할 수 없이 강하게 작동한다.

    바꿔 말하면 공짜는 ''1원 싸진 것'' 이 아니라 다른 종류의 사건이다.

    '
  확인한곳:
  - https://pubsonline.informs.org/doi/10.1287/mksc.1060.0254
  - https://web.mit.edu/ariely/www/MIT/Papers/zero.pdf
  - https://www.scirp.org/reference/referencespapers?referenceid=2503356

- id: AN-01
  이름: 앵커링 (기준점 효과)
  저자: Amos Tversky, Daniel Kahneman 이 처음 보고 · 이후 다수의 재현 연구
  연도: 1974 (원 보고) · Klein et al. 2014 (다중 실험실 재현) · Li 2025 (효과 크기 재평가)
  등급: B
  근거: 실증
  원문확인: false
  결과: |
    먼저 본 숫자가 그 뒤의 판단을 끌어당긴다.
    대규모 사전등록 다중 실험실 재현에서 방향은 견고하게 확인됐다.
  한계: |
    효과의 '크기' 는 초기의 표본 작은 연구들이 과장한 것으로 재평가됐다.
    익숙한 물건에서는 효과가 약하다.
    무관한 환경 앵커(우연히 눈에 띈 숫자)는 증거가 약하다.
    소비재 가격에서는 '가상의 결정' 일 때만 유지된다는 연구가 있다.
  확인한곳:
    - https://onlinelibrary.wiley.com/doi/10.1111/ecin.13279
    - https://pmc.ncbi.nlm.nih.gov/articles/PMC8730394/
    - https://online.ucpress.edu/collabra/article/6/1/19/113066/

- id: LA-01
  이름: 손실 회피 (Loss Aversion)
  저자: Daniel Kahneman, Amos Tversky 가 처음 제시
  연도: 1979 (전망 이론)
  등급: B
  근거: 실증
  원문확인: false
  주장: |
    같은 크기라면 손실이 이득보다 크게 느껴진다.
    교과서적으로 인용되는 계수는 약 2.25 (손실이 이득의 2배 남짓).

- id: LA-02
  이름: "The Loss of Loss Aversion: Will It Loom Larger Than Its Gain?"
  저자: David Gal, Derek Rucker
  기관: Journal of Consumer Psychology 28(3), 497-516
  연도: 2018
  등급: B
  근거: 실증
  원문확인: false
  S후보: true
  역할: LA-01 에 대한 정면 반박
  결과: |
    손실 회피가 크게 과잉일반화됐다고 결론짓는다.
    "현재 증거는 손실이 전반적으로 이득보다 더 영향력 있다는 것을 뒷받침하지 않는다."
    강한 형태도 약한 형태도 지지되지 않는다고 본다.
    현장 연구의 계수는 교과서의 2.0~2.5 가 아니라 1.0~1.5 에 가까운 경우가 많다.
    손실 회피로 잘못 귀속돼 온 현상들을 지적한다 — 처분 효과, 매몰비용 효과.
  후속: |
    이 반박에 대한 재반박도 학술지에 실렸다
    ("Bringing (Contingent) Loss Aversion Down to Earth", JCP).
    → 끝난 논쟁이 아니다. 양쪽을 다 밝히고 쓴다.
  확인한곳:
    - https://myscp.onlinelibrary.wiley.com/doi/10.1002/jcpy.1046
    - https://www.jasoncollins.blog/posts/the-case-against-loss-aversion
    - https://www.behavioraleconomics.com/resources/mini-encyclopedia-of-be/loss-aversion/
