원전:
- id: PH-01
  이름: How Much Is an Image Worth? Airbnb Property Demand Estimation Leveraging Large Scale Image Analytics
  저자: Shunyuan Zhang · Dokyun Lee · Param Vir Singh · Kannan Srinivasan
  기관: Carnegie Mellon University (Tepper) — 워킹페이퍼 / ICIS 2016 발표본
  연도: 2016~2018 (판본이 여럿이다)
  등급: B
  근거: 실증
  원문확인: false
  자료: 에어비앤비 숙소 7,423곳 · 16개월 패널 · 사진 51만 장 이상 · 이중차분(DID)
  결과: |
    에어비앤비가 무료로 보내준 전문 사진사가 찍은 사진('verified')으로 바꾼 숙소와
    그러지 않은 숙소를 비교했다.
      점유율          +8.98%
      수요            +17.51% (평균 숙소는 한 달 중 21.057% 예약된다는 전제)
      연간 추가 수익   약 $2,521
      효과의 58.83%   '전문 사진사가 찍었다는 표시' 가 아니라 사진 품질 자체에서 왔다
  숫자주의: |
    ⚠️ +8.98% 와 +17.51% 는 판본이 다른 수치로 보인다. 둘을 곱하거나 빼지 않는다.
       평균 점유율 21.057% 에 17.51% 를 곱하면 약 3.7%p 라 8.98% 와 맞지 않는다.
       원문을 못 열었으므로 어느 쪽이 맞는지 단정하지 않는다. 불일치.md 참고.
  한계: |
    무작위 배정이 아니다. 사진사를 부를지는 사장이 스스로 정했다(self-selection).
    저자들도 처치군·대조군의 사전 특성이 다르다는 점을 인정하고
    성향점수매칭·민감도 분석으로 보완했다고 밝힌다. 그래도 실험은 아니다.
  확인한곳:
  - https://aisel.aisnet.org/icis2016/Crowdsourcing/Presentations/8/
  - https://www.semanticscholar.org/paper/ad407322265c9858a9ceaa630ea21d01770ca57e

- id: PH-02
  이름: "What Makes a Good Image? Airbnb Demand Analytics Leveraging Interpretable Image Features"
  저자: Shunyuan Zhang · Dokyun Lee · Param Vir Singh · Kannan Srinivasan
  기관: Management Science (동료심사 학술지)
  연도: 2022
  등급: B
  근거: 실증
  원문확인: false
  자료: PH-01 과 같은 계열의 에어비앤비 데이터. 사진을 사람이 이해할 수 있는 특성으로 분해했다.
  결과: |
    사진을 12가지 '사람이 알아들을 수 있는' 특성으로 나눴다. 크게 세 갈래다.
      구도(composition)  ·  색(color)  ·  피사체와 배경의 관계(figure-ground)
    전문가 사진과 아마추어 사진 사이에 이 특성들이 체계적으로 달랐고,
    그중 수요에 가장 크게 작용한 것은 색(color) 이었다.
  확인한곳:
  - https://pubsonline.informs.org/doi/10.1287/mnsc.2021.4175
  - https://dl.acm.org/doi/10.1287/mnsc.2021.4175

- id: PH-03
  이름: Do Lower-Quality Images Lead to Higher Demand on Airbnb?
  저자: Shunyuan Zhang · Nitin Mehta · Param Vir Singh · Kannan Srinivasan
  기관: SSRN 워킹페이퍼 (abstract_id 4588974)
  연도: 2023-09-30
  등급: B
  근거: 실증
  원문확인: false
  자료: 맨해튼 숙소 958곳 · 1년 패널
  결과: |
    PH-01 을 쓴 팀이 스스로 단서를 달았다.
      좋은 사진은 '지금' 손님을 더 끌어온다.
      그런데 실물이 사진이 만든 기대에 못 미치면 손님이 실망한다.
      실망한 손님은 나쁜 리뷰를 남기거나 아예 리뷰를 남기지 않는다.
      그러면 '나중' 수요가 깎인다.
    반사실 시뮬레이션에서는 에어비앤비가 고품질 대신 중간 품질 사진을 무료로 주거나
    둘 중 고르게 하면 플랫폼 이익이 최대 18.9% 늘어나는 것으로 나왔다.
    이유는 사장이 자기 숙소 수준에 맞는 사진 품질을 고를 수 있게 되기 때문이다.
  확인한곳:
  - https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4588974
  - https://www.researchgate.net/publication/375137687_Do_Lower-Quality_Images_Lead_to_Higher_Demand_on_Airbnb

- id: PH-04
  이름: "Satiation from Sensory Simulation: Evaluating Foods Decreases Enjoyment of Similar Foods"
  저자: Jeffrey Larson · Joseph P. Redden · Ryan Elder
  기관: Journal of Consumer Psychology 24(2), 188~194 (동료심사 학술지)
  연도: 2014
  등급: B
  근거: 실증
  원문확인: false
  자료: 실험 2건. 음식 사진을 반복해서 평가·선택하게 한 뒤 실제 음식 맛을 평가시켰다.
  결과: |
    음식 사진을 반복해서 보고 평가하면, 실제로 먹지 않았는데도
    비슷한 맛의 음식에 대한 즐거움이 떨어졌다(감각특정적 포만).
    저자들이 제시한 경로는 '사진을 보면 머릿속에서 맛이 저절로 시뮬레이션되고,
    그 시뮬레이션만으로도 포만이 생긴다' 는 것이다.
  조건주의: |
    ★ 이건 '음식 사진을 올리지 마라' 가 아니다. 조건이 매우 좁다.
      · 같은 음식 사진을 30번 넘게 반복해서 본 경우에 나타났다.
      · 사진 속 음식에 주의를 기울여야 했다. 다른 요소를 보면 효과가 없었다.
      · '먹는 장면' 을 떠올리게 하는 자극이어야 했다.
    반대 방향 연구(사진이 식욕을 돋운다)도 많다. 생리 지표 쪽은 결론이 갈린다.
  확인한곳:
  - https://myscp.onlinelibrary.wiley.com/doi/10.1016/j.jcps.2013.09.001
  - https://www.sciencedirect.com/science/article/abs/pii/S105774081300079X
  - https://scholarsarchive.byu.edu/facpub/9290/

안쓰기로한것:
- 수치: "사진이 있는 업체는 길찾기 요청 42%, 웹사이트 클릭 35% 더 받는다"
  출처: 구글 비즈니스 프로필 관련 SEO 블로그 다수
  이유: |
    인용한 곳이 전부 SEO 대행사·마케팅 블로그다. 하나같이 '구글 자체 데이터' 라고만
    적고 원 문서·연도·표본을 대지 않는다. 구글 공식 문서에서 원문을 확인하지 못했다.
    숫자가 그럴듯할수록 원문 없이 쓰면 안 된다.
- 수치: "전문 사진을 쓰면 예약이 2.5배, 호스트 월 평균 $1,025"
  출처: 에어비앤비 자체 홍보 페이지
  이유: |
    플랫폼이 자기 유료·무료 서비스를 홍보하며 낸 수치다. 방법론이 공개돼 있지 않고
    비교 대상도 밝히지 않았다. PH-01 의 학술 수치와 자릿수가 다르다.
