  공식문서:
  - 이름: 플레이스 업체 검색 순위 알고리즘 안내
    url: https://help.naver.com/service/30026/contents/23472
  - 이름: 플레이스 업체 검색 순위를 높이는 방법 안내
    url: https://help.naver.com/service/30026/contents/23473
  - 이름: 플레이스 업체 검색 결과에서 어뷰징 요소의 판정 기준 안내
    url: https://help.naver.com/search/searchAll.help?searchText=%ED%94%8C%EB%A0%88%EC%9D%B4%EC%8A%A4+%EA%B2%80%EC%83%89+%EC%96%B4%EB%B7%B0%EC%A7%95
  - 이름: 플레이스 SEO 및 어뷰징 운영원칙
    url: https://smartplace.naver.com/help/policy?menu=abuse&tab=smartplace
  - 이름: 미용실 플레이스 시술사진 등록 기준 안내
    url: https://help.naver.com/service/30026/contents/20426
  - 이름: 플레이스 AI 브리핑 노출 안내
    url: https://help.naver.com/service/30026/contents/24632
  - 이름: 업체 신규등록 방법
    url: https://help.naver.com/service/30026/contents/20366
  결과: |
    확보한 발췌문(네이버 자체 색인 스니펫)에서 확인한 문장이다.

    ① 순위 요소 — 두 문서에 같은 문장이 실려 있다.
       "네이버 플레이스 검색 결과 순위는 이용자의 다양한 니즈를 고려하여,
        검색 질의에 대한 업체 유사도, 검색질의에 대한 카테고리와 업체의 인기도,
        거리, 정보의 충실성 등을 감안하여 결정합니다."
       → 유사도 · 인기도 · 거리 · 정보의 충실성. '등' 으로 끝나므로 전부가 아니다.

    ② 시술 사진 — 미용실 문서.
       "스마트플레이스에서 시술 사진을 등록하면 업체 정보뿐 아니라,
        네이버 검색 결과에도 함께 노출됩니다. 따라서 검색 결과 품질을 위해
        수시로 시술 사진 모니터링을 진행하고 있습니다.
        모자이크, 합성사진, 뒷머리만 ..."
       → 모자이크·합성사진·뒷머리만 나온 사진이 걸린다. 뒤는 끊겨서 모른다.

    ③ 어뷰징 — "각종 프로그램과 기술적인 도구들로 트래픽을 과도하게 유발" 하는
       행위를 판정 대상으로 삼는다고 밝힌다. 세부 기준은 확보하지 못했다.
  못한것: |
    전문 열람 (naver.com 접근 차단). 스니펫이 "..." 로 끊긴 뒤는 모른다.
    특히 시술사진 금지 목록의 나머지와, 순위 요소의 '등' 에 무엇이 더 있는지 모른다.
    23473(순위 높이는 방법) 은 본문 첫 문단 말고는 확보하지 못했다.
  승급조건: 위 URL 들을 열어 전문을 붙여 주시면 A. 특히 23472 · 23473 · 20426.
