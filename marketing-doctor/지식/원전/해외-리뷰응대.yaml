원전:
- id: RV-01
  이름: 'Reviews, Reputation, and Revenue: The Case of Yelp.com'
  저자: Michael Luca
  기관: Harvard Business School (NOM Unit Working Paper No. 12-016)
  연도: 2011-09-16 최초 · 2016-03-15 최종 개정
  등급: B
  근거: 실증
  원문확인: false
  S후보: true
  자료: Yelp.com 리뷰 + Washington State Department of Revenue 의 실제 매장 매출
  방법: '회귀 불연속(regression discontinuity).

    Yelp 가 평균 평점을 반올림해 표시하는 걸 이용했다.

    3.24 는 3.0 으로, 3.25 는 3.5 로 표시된다 — 실제 품질 차이는 없는데

    화면에 뜨는 별이 갈린다. 이 경계를 인과관계 식별에 썼다.

    '
  확인한곳:
  - https://papers.ssrn.com/sol3/papers.cfm?abstract_id=1928601
  - https://www.hbs.edu/faculty/Pages/item.aspx?num=41233
  - https://www.harvardmagazine.com/2011/10/hbs-study-finds-positive-yelp-reviews-lead-to-increased-business
  - https://ideas.repec.org/p/hbs/wpaper/12-016.html
- id: RV-02
  이름: 'Learning from the Crowd: Regression Discontinuity Estimates of the Effects of an Online Review
    Database'
  저자: Michael Anderson, Jeremy Magruder
  기관: The Economic Journal
  연도: 2012
  등급: B
  근거: 실증
  원문확인: false
  역할: RV-01 의 독립 재현 연구
  다른점: '도시가 다르다 (샌프란시스코 — Yelp 이용률이 더 높은 도시)

    자료가 다르다 (분기 매출이 아니라 일별 예약 가능 여부)

    방법이 다르다 (Luca 의 고정효과 추정이 아닌 다른 통계 기법)

    '
  확인한곳:
  - https://onlinelibrary.wiley.com/doi/abs/10.1111/j.1468-0297.2012.02512.x
  - https://www.researchgate.net/publication/256032694_Learning_from_the_Crowd_Regression_Discontinuity_Estimates_of_the_Effects_of_an_Online_Review_Database
- id: RP-01
  이름: 'Online Reputation Management: Estimating the Impact of Management Responses on Consumer Reviews'
  저자: Davide Proserpio, Georgios Zervas
  기관: Marketing Science 36(5), 645-665
  연도: 2017
  등급: B
  근거: 실증
  원문확인: false
  S후보: true
  자료: TripAdvisor 호텔 리뷰·답글 수만 건
  결과: "답글을 달기 시작한 호텔은 평점 0.12별 상승, 리뷰 수 12% 증가.\n호텔은 긍정·부정·중립 리뷰에 비슷한 비율로 답글을 단다.\n★ 답글을 달기 시작하면 부정 리뷰가\
    \ '줄어들되 길어진다' —\n  불만족 고객이 짧고 방어 불가능한 리뷰를 남기기 덜 하게 된다.\n  사장님이 들여다볼 것을 알기 때문이다.\n"
  주의: '관측 자료다. 호텔은 평점에 부정적 충격이 온 뒤 답글을 시작하는 경향이 있어

    역인과 문제가 있다. 저자들이 그 점을 다뤘다고 보고된다.

    '
  확인한곳:
  - https://pubsonline.informs.org/doi/abs/10.1287/mksc.2017.1043
  - https://www.informs.org/News-Room/INFORMS-Releases/News-Releases/Want-to-improve-your-business-s-online-ratings-Make-sure-to-respond-to-reviews
  - https://ideas.repec.org/a/inm/ormksc/v36y2017i5p645-665.html
- id: RP-02
  이름: 'The Direct Effect of Managerial Responses: When Politeness Backfires'
  저자: Haofeng Jin, Lili Wang, Yayuan Liu, Yu Tong
  연도: 2025
  등급: B
  근거: 실증
  원문확인: false
  서지불완전: 학술지명을 확보하지 못했다 (SAGE 게재). 인용 전 확인 필요.
  역할: RP-01 의 조건을 좁히는 연구
  결과: '답글의 긍정적 직접 효과가 ''정중함 수준'' 에 의해 부정적으로 조절된다.

    정중함이 높아질수록 리뷰어가 답글을 ''설득하려는 시도'' 로 인식한다.

    '
  확인한곳:
  - https://journals.sagepub.com/doi/10.1177/10591478241309439
- id: LR-01
  이름: The Short Life of Online Sales Leads
  저자: James B. Oldroyd, Kristina McElheran, David Elkington
  기관: Harvard Business Review 2011년 3월호
  연도: 2011
  등급: B
  근거: 실증
  원문확인: false
  S후보: true
  자료: 미국 2,241개 기업에 시험 문의를 넣어 응답을 감사
  결과: '1시간 내 응답 37% / 1~24시간 16% / 24시간 초과 24% / 아예 응답 안 함 23%

    응답한 곳의 평균 응답 시간 42시간

    1시간 내 접촉한 기업은 리드를 검증할 확률이 약 7배,

    24시간 이상 기다린 곳 대비 60배 이상 높았다

    '
- id: LR-02
  이름: Lead Response Management 연구 (MIT · InsideSales.com)
  저자: James Oldroyd
  연도: 2007
  등급: B
  근거: 실증
  원문확인: false
  자료: 2004~2007년 3년치 · 6개 회사 · 리드 15,000건 이상 · 통화 시도 10만 건 이상
  결과: 널리 인용되는 "5분 안에 연락하면 접촉 100배 · 검증 21배" 수치의 실제 출처
  ★출처오인: '이 100배·21배 수치가 ''HBR 연구'' 로 잘못 인용되는 일이 흔하다.

    HBR(LR-01)은 다른 연구이고 다른 숫자를 냈다.

    HBR 이 더 유명한 이름이라 수치가 그쪽에 붙어 떠돈 것으로 보인다.

    '
  확인한곳:
  - https://www.expertise.ai/stats/speed-to-lead-statistics
