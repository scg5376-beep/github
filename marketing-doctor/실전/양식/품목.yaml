# 품목카드 — 품목 레포의 보고/품목.yaml 에 이 틀을 복사해 채운다.
# 시작할 때 한 번 쓰고 거의 안 고친다. 고쳤으면 기록.md 에 왜 고쳤는지 남긴다.
# 상호·지역·전화번호는 적지 않는다 (엔진/brand_check.py 가 잡는다).

품목: ""                    # 예: "샴푸 500ml"
시작일: ""                  # 2026-09-08
파는곳: []                  # [스마트스토어] · [쿠팡] · [자사몰] 중 해당하는 것

수수료:
  npay: null                # % · 정산 화면에서 확인한 값
  판매수수료: null           # % · 그냥 팔릴 때
  직접유입수수료: null        # % · 판매자 마케팅 수수료가 붙을 때

자리0:                      # 시작 전에 다 닫는다 (스킬 references/0-...)
  통신판매업: false          # 신고 완료 또는 면제 확인
  제10조표시: false
  처리방침게재: false
  청약철회안내: false

가정:                       # 시작할 때 세운 가정. 12주 뒤에 맞았는지 본다
  검색갈래: ""              # 정보형 · 상업형 · 거래형 · 이동형
  첫자리: ""                # 블로그 · 플레이스 · 사이트 · 메타 · 광고
  왜: ""                    # 한 줄

판단지표:
  주지표: 직접유입주문비율
  목표: null                # % · 이 값을 넘으면 계속한다
  기간주: 12

안하기로한것:                # 시작할 때 못 박는다. 나중에 조급해지면 하게 된다
  브랜드키워드광고: 안함
  한주에둘이상바꾸기: 안함
  순위추적으로판단: 안함
